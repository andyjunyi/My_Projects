<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學測英文字彙學習平台</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --secondary: #7c3aed;
    --accent: #059669;
    --danger: #dc2626;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    color: #fff; padding: 0 24px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(37,99,235,0.3);
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; }
  header h1 span { opacity: 0.75; font-weight: 400; margin-left: 8px; font-size: 0.9rem; }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .progress-chip {
    background: rgba(255,255,255,0.2); border-radius: 20px;
    padding: 4px 14px; font-size: 0.82rem; cursor: pointer;
    transition: background 0.2s;
  }
  .progress-chip:hover { background: rgba(255,255,255,0.3); }

  /* ── Nav Tabs ── */
  .nav-tabs {
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; gap: 0; padding: 0 24px; overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab {
    padding: 14px 22px; cursor: pointer; font-size: 0.9rem; font-weight: 500;
    color: var(--text-muted); border-bottom: 3px solid transparent;
    white-space: nowrap; transition: all 0.2s; user-select: none;
  }
  .nav-tab:hover { color: var(--primary); }
  .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* ── Layout ── */
  .layout { display: flex; height: calc(100vh - 108px); }
  .sidebar {
    width: 260px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); overflow-y: auto;
    padding: 16px 12px;
  }
  .main { flex: 1; overflow-y: auto; padding: 24px; }

  /* ── Sidebar ── */
  .sidebar-section { margin-bottom: 20px; }
  .sidebar-label {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted); padding: 0 8px 8px;
  }
  .cat-btn {
    width: 100%; text-align: left; padding: 9px 12px; border: none;
    background: none; border-radius: 8px; cursor: pointer;
    font-size: 0.88rem; color: var(--text); transition: all 0.15s;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cat-btn:hover { background: var(--bg); }
  .cat-btn.active { background: #eff6ff; color: var(--primary); font-weight: 600; }
  .cat-count {
    font-size: 0.75rem; background: var(--border); border-radius: 10px;
    padding: 1px 7px; color: var(--text-muted);
  }
  .cat-btn.active .cat-count { background: #bfdbfe; color: var(--primary); }

  /* ── Search ── */
  .search-wrap { position: relative; margin-bottom: 20px; }
  .search-wrap input {
    width: 100%; padding: 10px 16px 10px 40px; border: 1.5px solid var(--border);
    border-radius: var(--radius); font-size: 0.9rem; background: var(--surface);
    outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--primary); }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none; font-size: 1rem;
  }
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 14px; border: 1.5px solid var(--border); border-radius: 20px;
    font-size: 0.8rem; cursor: pointer; background: var(--surface);
    transition: all 0.15s; color: var(--text-muted);
  }
  .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
  .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* ── Word Grid ── */
  .word-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .word-card {
    background: var(--surface); border-radius: var(--radius);
    border: 1.5px solid var(--border); padding: 18px;
    cursor: pointer; transition: all 0.2s; position: relative;
    overflow: hidden;
  }
  .word-card:hover { border-color: var(--primary); box-shadow: 0 4px 16px rgba(37,99,235,0.12); transform: translateY(-1px); }
  .word-card.learned { border-color: #86efac; background: #f0fdf4; }
  .word-card.starred { border-color: #fcd34d; }
  .word-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .word-en { font-size: 1.15rem; font-weight: 700; color: var(--text); }
  .word-pos {
    font-size: 0.72rem; background: #eff6ff; color: var(--primary);
    border-radius: 6px; padding: 2px 8px; font-weight: 600; margin-left: 6px;
    vertical-align: middle;
  }
  .word-ph { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-family: monospace; }
  .word-zh { font-size: 0.95rem; color: var(--text); margin-bottom: 8px; font-weight: 500; }
  .word-example { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; font-style: italic; border-left: 3px solid var(--border); padding-left: 8px; }
  .word-actions { display: flex; gap: 6px; margin-top: 10px; }
  .word-btn {
    flex: 1; padding: 5px; border: 1px solid var(--border); border-radius: 7px;
    background: none; cursor: pointer; font-size: 0.78rem; color: var(--text-muted);
    transition: all 0.15s;
  }
  .word-btn:hover { background: var(--bg); }
  .word-btn.learned-btn.on { background: #dcfce7; border-color: #86efac; color: var(--accent); }
  .word-btn.star-btn.on { background: #fef9c3; border-color: #fcd34d; color: #d97706; }
  .learned-badge {
    position: absolute; top: 10px; right: 10px;
    width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 0.7rem;
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface); border-radius: var(--radius); padding: 14px 20px;
    border: 1.5px solid var(--border); display: flex; align-items: center; gap: 12px;
    min-width: 140px;
  }
  .stat-icon { font-size: 1.5rem; }
  .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 0.78rem; color: var(--text-muted); }

  /* ── Progress bar ── */
  .progress-wrap { background: var(--surface); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; border: 1.5px solid var(--border); }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; }
  .progress-bar { height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 10px; transition: width 0.5s ease; }

  /* ── YouTube Section ── */
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-title { font-size: 1.1rem; font-weight: 700; }
  .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .video-card {
    background: var(--surface); border-radius: var(--radius); overflow: hidden;
    border: 1.5px solid var(--border); transition: all 0.2s; cursor: pointer;
  }
  .video-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .video-thumb {
    position: relative; padding-top: 56.25%; background: #0f0f0f; overflow: hidden;
  }
  .video-thumb iframe {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
  }
  .video-thumb-placeholder {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e3a5f, #2d1b69);
    color: #fff; cursor: pointer;
  }
  .play-btn {
    width: 56px; height: 56px; background: rgba(255,255,255,0.9);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px; transition: transform 0.2s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .play-btn svg { width: 24px; height: 24px; fill: #1e3a5f; margin-left: 4px; }
  .video-thumb-placeholder:hover .play-btn { transform: scale(1.1); }
  .video-info { padding: 14px; }
  .video-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
  .video-meta { font-size: 0.78rem; color: var(--text-muted); }
  .add-video-form {
    background: var(--surface); border-radius: var(--radius); padding: 20px;
    border: 1.5px dashed var(--border); margin-bottom: 24px;
  }
  .add-video-form h3 { margin-bottom: 12px; font-size: 0.95rem; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-input {
    flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.88rem; outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--primary); }
  .btn {
    padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 0.88rem; font-weight: 600; transition: all 0.15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-danger { background: #fee2e2; color: var(--danger); }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

  /* ── PDF Section ── */
  .pdf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .pdf-card {
    background: var(--surface); border-radius: var(--radius); padding: 20px;
    border: 1.5px solid var(--border); transition: all 0.2s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .pdf-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .pdf-icon { font-size: 2.5rem; }
  .pdf-name { font-weight: 600; font-size: 0.92rem; }
  .pdf-meta { font-size: 0.78rem; color: var(--text-muted); }
  .pdf-actions { display: flex; gap: 8px; margin-top: 4px; }
  .pdf-viewer-wrap { margin-top: 20px; background: var(--surface); border-radius: var(--radius); border: 1.5px solid var(--border); overflow: hidden; }
  .pdf-viewer-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; }
  .pdf-embed { width: 100%; height: 600px; border: none; }

  /* ── Quiz ── */
  .quiz-container { max-width: 600px; margin: 0 auto; }
  .quiz-card {
    background: var(--surface); border-radius: 16px; padding: 32px;
    border: 1.5px solid var(--border); text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06); min-height: 320px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .quiz-progress-bar { height: 6px; background: var(--border); border-radius: 6px; margin-bottom: 24px; overflow: hidden; }
  .quiz-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.4s; }
  .quiz-q { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 8px; }
  .quiz-word { font-size: 2rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .quiz-ph { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px; font-family: monospace; }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quiz-opt {
    padding: 14px; border: 2px solid var(--border); border-radius: 10px;
    background: none; cursor: pointer; font-size: 0.92rem; transition: all 0.15s;
    text-align: left;
  }
  .quiz-opt:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
  .quiz-opt.correct { border-color: var(--accent); background: #dcfce7; color: var(--accent); }
  .quiz-opt.wrong { border-color: var(--danger); background: #fee2e2; color: var(--danger); }
  .quiz-opt:disabled { cursor: default; }
  .quiz-controls { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
  .quiz-result {
    background: var(--surface); border-radius: 16px; padding: 40px;
    text-align: center; border: 1.5px solid var(--border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .result-score { font-size: 3.5rem; font-weight: 800; color: var(--primary); }
  .result-label { font-size: 1rem; color: var(--text-muted); margin-bottom: 24px; }
  .quiz-mode-select {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .mode-card {
    background: var(--surface); border-radius: var(--radius); padding: 24px;
    border: 2px solid var(--border); cursor: pointer; text-align: center;
    transition: all 0.2s;
  }
  .mode-card:hover { border-color: var(--primary); background: #eff6ff; }
  .mode-icon { font-size: 2rem; margin-bottom: 8px; }
  .mode-name { font-weight: 700; margin-bottom: 4px; }
  .mode-desc { font-size: 0.8rem; color: var(--text-muted); }

  /* ── Flashcard ── */
  .flashcard-wrap { perspective: 1000px; max-width: 500px; margin: 0 auto 24px; }
  .flashcard {
    width: 100%; height: 240px; position: relative; cursor: pointer;
    transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; border: 2px solid var(--border);
  }
  .flashcard-front { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .flashcard-back { background: var(--surface); transform: rotateY(180deg); }
  .fc-hint { font-size: 0.78rem; opacity: 0.7; margin-top: 12px; }
  .fc-word { font-size: 2rem; font-weight: 800; text-align:center; }
  .fc-ph { font-size: 0.9rem; opacity: 0.8; margin-top: 6px; font-family: monospace; text-align:center; }
  .fc-speak-btn { position:absolute; top:12px; right:14px; background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
  .fc-speak-btn:hover { background:rgba(255,255,255,0.35); }
  .fc-zh { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .fc-example { font-size: 0.82rem; color: var(--text-muted); font-style: italic; text-align: center; }
  .fc-controls { display: flex; gap: 12px; justify-content: center; }
  .fc-nav { display: flex; align-items: center; gap: 16px; justify-content: center; margin-bottom: 16px; font-size: 0.85rem; color: var(--text-muted); }

  /* ── Empty state ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; }
  .empty p { font-size: 0.95rem; }

  /* ── Notification ── */
  .notif {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    background: var(--text); color: #fff; padding: 12px 20px; border-radius: 10px;
    font-size: 0.88rem; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    animation: slideIn 0.3s ease; pointer-events: none;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 200;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface); border-radius: 16px; padding: 28px;
    max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal h2 { margin-bottom: 16px; }
  .modal-close { float: right; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }

  /* ── Video Search ── */
  .video-search-wrap {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 0 16px; height: 48px;
    margin-bottom: 20px; transition: border-color 0.2s;
  }
  .video-search-wrap:focus-within { border-color: var(--primary); }
  .video-search-wrap input { flex: 1; background: transparent; border: none; outline: none; font-size: 0.92rem; }
  .video-search-count { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }
  .vsr-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .vsr-item {
    display: flex; gap: 12px; background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 14px; text-decoration: none; color: var(--text);
    transition: all 0.15s; align-items: center;
  }
  .vsr-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(37,99,235,0.1); }
  .vsr-thumb { width: 96px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: #000; }
  .vsr-thumb img { width: 100%; display: block; }
  .vsr-info { flex: 1; min-width: 0; }
  .vsr-title { font-weight: 600; font-size: 0.88rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vsr-desc { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vsr-playlist { font-size: 0.72rem; color: var(--text-muted); }
  .vsr-badge { display: inline-block; font-size: 0.68rem; padding: 1px 7px; border-radius: 10px; margin-right: 6px; font-weight: 600; vertical-align: middle; }
  .vsr-badge.sap { background: #1e3a5f; color: white; }
  .vsr-badge.vocab { background: #eff6ff; color: #2563eb; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .layout { height: auto; flex-direction: column; }
    .main { padding: 16px; }
    .word-grid { grid-template-columns: 1fr; }
    .quiz-options { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>學測英文字彙 <span>GSAT Vocabulary</span></h1>
  <div class="header-right">
    <div class="progress-chip" onclick="showTab('quiz')">開始測驗</div>
    <div class="progress-chip" id="headerProgress">0 / 0 已學</div>
  </div>
</header>

<nav class="nav-tabs">
  <div class="nav-tab active" onclick="showTab('vocab')" data-tab="vocab">字彙庫</div>
  <div class="nav-tab" onclick="showTab('flashcard')" data-tab="flashcard">閃卡練習</div>
  <div class="nav-tab" onclick="showTab('quiz')" data-tab="quiz">測驗</div>
  <div class="nav-tab" onclick="showTab('videos')" data-tab="videos">YouTube 影片</div>
  <div class="nav-tab" onclick="showTab('pdfs')" data-tab="pdfs">PDF 講義</div>
  <div class="nav-tab" onclick="showTab('stats')" data-tab="stats">學習統計</div>
</nav>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">分類</div>
      <button class="cat-btn active" onclick="filterCat('all')" data-cat="all">
        全部 <span class="cat-count" id="cnt-all">0</span>
      </button>
      <button class="cat-btn" onclick="filterCat('starred')" data-cat="starred">
        已收藏 <span class="cat-count" id="cnt-starred">0</span>
      </button>
      <button class="cat-btn" onclick="filterCat('learned')" data-cat="learned">
        已學會 <span class="cat-count" id="cnt-learned">0</span>
      </button>
      <button class="cat-btn" onclick="filterCat('notlearned')" data-cat="notlearned">
        未學會 <span class="cat-count" id="cnt-notlearned">0</span>
      </button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">詞性</div>
      <button class="cat-btn" onclick="filterCat('n.')" data-cat="n.">名詞 n. <span class="cat-count" id="cnt-n.">0</span></button>
      <button class="cat-btn" onclick="filterCat('v.')" data-cat="v.">動詞 v. <span class="cat-count" id="cnt-v.">0</span></button>

let videoMap = {};        // lowercase word → { videoId, url, playlist, zh }
let channelPlaylists = []; // [{id, title, book, videos:[...]}]
let sapPlaylists = [];     // [{year, title, playlistId, videos:[...]}]

function parseVocabTitle(raw) {
  const wordMatch = raw.replace(/^\d+\s+/, '').match(/^([A-Za-z][A-Za-z'\-]*)/);
  const word = wordMatch ? wordMatch[1].toLowerCase() : '';
  const posMatch = raw.match(/\(?(vi\.|vt\.|v\.|n\.|adj\.|adv\.|prep\.|conj\.|pron\.|interj\.)\)?/);
  const pos = posMatch ? posMatch[1] : '';
  // 直接從第一個 CJK 字取中譯，不依賴 pos 分割（更穩健）
  const zhIdx = raw.search(/[\u4e00-\u9fff]/);
  const zh = zhIdx >= 0 ? raw.substring(zhIdx).trim() : '';
  return { word, pos, zh };
}

function getBookGroupLocal(t) {
  if (/\bB1/.test(t)) return '第1冊 (B1)';
  if (/\bB2/.test(t)) return '第2冊 (B2)';
  if (/\bB3/.test(t)) return '第3冊 (B3)';
  if (/\bB4/.test(t)) return '第4冊 (B4)';
  if (/\bB5/.test(t)) return '第5冊 (B5)';
  if (/Book\s?2/.test(t)) return 'Book 2';
  if (/Book\s?3/.test(t)) return 'Book 3';
  if (/Book\s?4/.test(t)) return 'Book 4';
  if (t.includes('Unit')) return 'Unit 系列';
  if (t.includes('Lesson')) return 'Lesson 系列';
  return '其他';
}

async function loadVideoData() {
  try {
    const [vocData, sapData] = await Promise.all([
      fetch(encodeURI('臺南市立大灣高中影音教學頻道_vocabulary.json')).then(r => r.json()),
      fetch(encodeURI('臺南市立大灣高中影音教學頻道_2026-03-07.json')).then(r => r.json()),
    ]);

    // 處理課本單字影片
    const plMap = {};
    vocData.videos.forEach(v => {
      const id = v.playlistId;
      const t = v.playlistTitle;
      if (!plMap[id]) {
        let cat = 'hs';
        if (/國中|2000/.test(t)) cat = 'jh';
        else if (/高職/.test(t)) cat = 'voc';
        plMap[id] = { id, title: t, book: cat === 'hs' ? getBookGroupLocal(t) : t, cat, videos: [] };
      }
      const p = parseVocabTitle(v.title);
      const entry = { word: p.word, pos: p.pos, zh: p.zh, videoId: v.videoId, url: v.youtubeUrl, rawTitle: v.title };
      plMap[id].videos.push(entry);
      if (p.word && !videoMap[p.word]) {
        videoMap[p.word] = { videoId: v.videoId, url: v.youtubeUrl, playlist: t, zh: p.zh, pos: p.pos };
      }
    });
    channelPlaylists = Object.values(plMap).sort((a, b) => a.book.localeCompare(b.book, 'zh-TW') || a.title.localeCompare(b.title, 'zh-TW'));

    // 處理學測文意字彙影片
    const sapMap = {};
    sapData.videos.forEach(v => {
      const yr = parseInt(v.playlistTitle.match(/\d+/)[0]);
      if (!sapMap[yr]) sapMap[yr] = { year: yr, title: v.playlistTitle, playlistId: v.playlistId, videos: [] };
      sapMap[yr].videos.push({ videoId: v.videoId, title: v.title, description: v.description || '', url: v.youtubeUrl, index: v.videoIndex });
    });
    sapPlaylists = Object.values(sapMap).sort((a, b) => b.year - a.year);

  } catch(e) {
    console.warn('無法載入頻道影片資料：', e.message);
  }
}

function saveState() {
  localStorage.setItem('gsatState', JSON.stringify({
    wordBankVersion: 'vocab-v20',
    words: state.words,
    videos: state.videos,
    pdfs: state.pdfs,
    learned: state.learned,
    starred: state.starred,
    quizHistory: state.quizHistory,
  }));
}

function loadState(defaultWords) {
  const base = defaultWords || DEFAULT_WORDS;
  const saved = localStorage.getItem('gsatState');
  if (saved) {
    const s = JSON.parse(saved);
    // 若版本不符（舊的 125 字預設），自動遷移到新字彙庫
    const needsMigration = s.wordBankVersion !== 'vocab-v20';
    state.words = (!needsMigration && s.words && s.words.length) ? s.words : [...base];
    state.videos = s.videos || [];
    state.pdfs = s.pdfs || [];
    state.learned = s.learned || {};
    state.starred = s.starred || {};
    state.quizHistory = s.quizHistory || [];
  } else {
    state.words = [...base];
    state.videos = [];
    state.pdfs = [];
  }
}

function showTab(tab) {
  ['vocab','flashcard','quiz','videos','pdfs','stats'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t === tab ? '' : 'none';
  });
  document.querySelectorAll('.nav-tab').forEach(el => {

  const sidebar = document.getElementById('sidebar');
  sidebar.style.display = tab === 'vocab' ? '' : 'none';

  if (tab === 'videos') renderVideos();
  if (tab === 'pdfs') renderPdfs();

    document.getElementById('quizSetup').style.display = '';
    document.getElementById('quizArea').style.display = 'none';
  }
}

function getFilteredWords() {
  let words = [...state.words];
  const q = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
  if (q) {
    words = words.filter(w =>
      w.en.toLowerCase().includes(q) ||
      w.zh.includes(q) ||
      (w.ex && w.ex.toLowerCase().includes(q))
    );
  }
  if (state.currentCat === 'starred') words = words.filter(w => state.starred[w.id]);
  else if (state.currentCat === 'learned') words = words.filter(w => state.learned[w.id]);
  else if (state.currentCat === 'notlearned') words = words.filter(w => !state.learned[w.id]);
  else if (state.currentCat !== 'all') {
    const isVerb = state.currentCat === 'v.';
    words = words.filter(w => (isVerb ? /^v[it]?\.$/.test(w.pos) : w.pos === state.currentCat) || w.topic === state.currentCat);
  }
  if (state.currentSort === 'az') words.sort((a,b) => a.en.localeCompare(b.en));
  else if (state.currentSort === 'za') words.sort((a,b) => b.en.localeCompare(a.en));
  else if (state.currentSort === 'random') words.sort(() => Math.random()-0.5);
  return words;
}

function renderVocab() {
  const words = getFilteredWords();
  const grid = document.getElementById('wordGrid');
  if (!words.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">&#128269;</div><p>找不到符合的字彙</p></div>';
    return;
  }
  grid.innerHTML = words.map(w => `
    <div class="word-card${state.learned[w.id] ? ' learned' : ''}${state.starred[w.id] ? ' starred' : ''}" id="wc-${w.id}">
      ${state.learned[w.id] ? '<div class="learned-badge">&#10003;</div>' : ''}
      <div class="word-card-header">
        <div>
          <span class="word-en">${w.en}</span>
          <span class="word-pos">${w.pos}</span>
        </div>
      </div>
      <div class="word-ph">${w.ph || ''}</div>
      <div class="word-zh">${w.zh}</div>
      ${w.ex ? `<div class="word-example">${highlight(w.en, w.ex)}</div>` : ''}
      <div class="word-actions">
        <button class="word-btn learned-btn${state.learned[w.id] ? ' on' : ''}" onclick="toggleLearned(${w.id})">
          ${state.learned[w.id] ? '&#9989; 已學會' : '&#9744; 學會了'}
        </button>
        <button class="word-btn star-btn${state.starred[w.id] ? ' on' : ''}" onclick="toggleStar(${w.id})">
          ${state.starred[w.id] ? '&#11088; 已收藏' : '&#9733; 收藏'}
        </button>
        ${(w.videoId || videoMap[w.en.toLowerCase()]) ? `<a class="word-btn" href="${w.videoUrl || videoMap[w.en.toLowerCase()].url}" target="_blank" style="color:#dc2626;border-color:#fca5a5;text-decoration:none;display:flex;align-items:center;justify-content:center">▶ 影片</a>` : ''}
        <button class="word-btn" onclick="deleteWord(${w.id})" style="max-width:36px;color:var(--danger)">&#10005;</button>
      </div>
    </div>
  `).join('');
  updateSidebarCounts();
  updateHeaderProgress();
}

function highlight(word, sentence) {
  const re = new RegExp(`(${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return sentence.replace(re, '<strong>$1</strong>');
}

function toggleLearned(id) {
  state.learned[id] = !state.learned[id];
  saveState();
  renderVocab();
  notify(state.learned[id] ? '已標記為學會!' : '已取消學會標記');
}

function toggleStar(id) {
  state.starred[id] = !state.starred[id];
  saveState();
  renderVocab();
  notify(state.starred[id] ? '已加入收藏!' : '已取消收藏');
}

function deleteWord(id) {
  if (!confirm('確定要刪除這個字彙嗎？')) return;
  state.words = state.words.filter(w => w.id !== id);
  delete state.learned[id];
  delete state.starred[id];
  saveState();
  renderVocab();
}

function filterCat(cat) {
  state.currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  renderVocab();
}

function setSort(sort, btn) {

// ══════════════════════════════════════════════════════
//  FLASHCARD
// ══════════════════════════════════════════════════════
let fcWords = [], fcIdx = 0, fcFlipped = false;

function startFlashcard(scope) {
  let words = [...state.words];
  if (scope === 'starred') words = words.filter(w => state.starred[w.id]);
  if (scope === 'notlearned') words = words.filter(w => !state.learned[w.id]);
  words = words.sort(() => Math.random() - 0.5);
  if (!words.length) { notify('沒有符合條件的字彙'); return; }
  const count = parseInt(document.getElementById('fcCount')?.value || '0');
  if (count > 0) words = words.slice(0, count);
  fcWords = words; fcIdx = 0; fcFlipped = false;
  renderFlashcard();
}

function renderFlashcard() {
  const area = document.getElementById('flashcardArea');
  if (!fcWords.length) {
    area.innerHTML = '<div class="empty"><div class="empty-icon">&#127881;</div><p>沒有字彙，請先新增!</p></div>';
    return;
  }
  const w = fcWords[fcIdx];
  area.innerHTML = `
    <div class="fc-nav">
      <button class="btn btn-sm" onclick="fcPrev()">&#9664; 上一張</button>
      <span>${fcIdx+1} / ${fcWords.length}</span>
      <button class="btn btn-sm" onclick="fcNext()">下一張 &#9654;</button>
    </div>
    <div class="flashcard-wrap">
      <div class="flashcard" id="fc" onclick="fcFlip()">
        <div class="flashcard-face flashcard-front">
          <button class="fc-speak-btn" onclick="event.stopPropagation();speakWord('${w.en.replace(/'/g,"\\'")}');" title="發音">🔊</button>
          <div class="fc-word">${w.en}</div>
          <div class="fc-ph">${w.ph || ''}</div>
          <div class="fc-hint">點擊翻面看答案</div>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="fc-zh">${w.zh}</div>
          <div class="word-pos" style="margin-bottom:8px">${w.pos}</div>
          ${w.ex ? `<div class="fc-example">${w.ex}</div>` : ''}
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="btn ${state.learned[w.id]?'btn-danger':'btn-primary'}" onclick="toggleLearned(${w.id});renderFlashcard()">
        ${state.learned[w.id]?'取消學會':'標記為學會'}
      </button>
      <button class="btn" style="background:var(--bg);border:1.5px solid var(--border)" onclick="toggleStar(${w.id});renderFlashcard()">
        ${state.starred[w.id]?'&#11088; 已收藏':'&#9733; 收藏'}
      </button>
    </div>
    <div style="text-align:center;font-size:0.78rem;color:var(--text-muted);margin-top:12px">
      ← → 換頁 &nbsp;|&nbsp; ↑ 發音 &nbsp;|&nbsp; ↓ 翻面 &nbsp;|&nbsp; 空白鍵 學會 &nbsp;|&nbsp; S 收藏
    </div>
  `;
  if (document.getElementById('fcAutoSpeak')?.checked) speakWord(w.en);
}

let _fcVoice = null;
function _initFcVoice() {
  if (_fcVoice) return;
  const voices = window.speechSynthesis.getVoices();
  _fcVoice = voices.find(v => v.lang.startsWith('en') && /Natural|Online/i.test(v.name))
    || voices.find(v => v.lang.startsWith('en') && /Google US/i.test(v.name))
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang.startsWith('en'))
    || null;
}
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = _initFcVoice;
  _initFcVoice();
}

function speakWord(text) {
  if (!window.speechSynthesis) return;
  _initFcVoice();
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = 0.9;
  if (_fcVoice) utt.voice = _fcVoice;
  window.speechSynthesis.speak(utt);
}

function fcFlip() {
  fcFlipped = !fcFlipped;
  const fc = document.getElementById('fc');
  if (fc) fc.classList.toggle('flipped', fcFlipped);
}
function fcNext() {
  if (fcIdx < fcWords.length - 1) { fcIdx++; fcFlipped = false; renderFlashcard(); return; }
  showFcQuizPicker();
}
function fcPrev() { if (fcIdx > 0) { fcIdx--; fcFlipped=false; renderFlashcard(); } }

function showFcQuizPicker() {
  let overlay = document.getElementById('fcQuizOverlay');
  if (overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.id = 'fcQuizOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML = `
    <div style="background:var(--surface);border-radius:16px;padding:32px 28px;max-width:360px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
      <div style="font-size:2rem;margin-bottom:8px">🎉</div>
      <div style="font-size:1.15rem;font-weight:700;margin-bottom:6px">閃卡練習完畢！</div>
      <div style="font-size:0.88rem;color:var(--text-muted);margin-bottom:20px">共 ${fcWords.length} 個單字，是否進行測驗？</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
        <button class="btn btn-primary" onclick="startQuizFromFlashcard('mc4')">四選一（看英文選中文）</button>
        <button class="btn btn-primary" onclick="startQuizFromFlashcard('mc4rev')">反向四選一（看中文選英文）</button>
        <button class="btn btn-primary" onclick="startQuizFromFlashcard('fill')">填空（看中文填英文）</button>
      </div>
      <button class="btn" style="width:100%;background:var(--bg);border:1.5px solid var(--border)" onclick="document.getElementById('fcQuizOverlay').remove()">不用了，繼續練習</button>
    </div>`;
  document.body.appendChild(overlay);
}

function startQuizFromFlashcard(mode) {
  const overlay = document.getElementById('fcQuizOverlay');
  if (overlay) overlay.remove();
  let pool = [...fcWords];
  if (mode === 'mc4rev' || mode === 'fill') pool = pool.filter(w => w.zh);
  if (pool.length < 4) { notify('閃卡單字不足 4 個，無法進行測驗'); return; }
  quiz = { words: pool, idx: 0, score: 0, mode, answers: [] };
  showTab('quiz');
  document.getElementById('quizSetup').style.display = 'none';
  document.getElementById('quizArea').style.display  = '';
  renderQuiz();
}

document.addEventListener('keydown', function(e) {
  if (document.getElementById('tab-flashcard').style.display === 'none') return;
  if (!fcWords.length) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  const w = fcWords[fcIdx];
  if (e.key === 'ArrowRight') { e.preventDefault(); fcNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); fcPrev(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); fcFlip(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); speakWord(w.en); }
  else if (e.key === ' ') { e.preventDefault(); toggleLearned(w.id); renderFlashcard(); }
  else if (e.key === 's' || e.key === 'S') { e.preventDefault(); toggleStar(w.id); renderFlashcard(); }
});

//  QUIZ
// ══════════════════════════════════════════════════════
let quiz = { words:[], idx:0, score:0, mode:'', answers:[] };

function startQuiz(mode) {
  const range = document.getElementById('quizRange').value;
  const count = parseInt(document.getElementById('quizCount').value);
  let pool = [...state.words];
  if (range === 'starred') pool = pool.filter(w => state.starred[w.id]);
  if (range === 'notlearned') pool = pool.filter(w => !state.learned[w.id]);
  if (mode === 'mc4rev' || mode === 'fill') pool = pool.filter(w => w.zh);  // 需顯示中文提示
  if (pool.length < 4) { notify('字彙不足（至少需要 4 個）'); return; }
  pool = pool.sort(() => Math.random()-0.5).slice(0, count);
  quiz = { words: pool, idx: 0, score: 0, mode, answers: [] };
  document.getElementById('quizSetup').style.display = 'none';
  document.getElementById('quizArea').style.display = '';
  renderQuiz();
}

function renderQuiz() {
  const area = document.getElementById('quizArea');
  if (quiz.idx >= quiz.words.length) {
    renderQuizResult(); return;
  }
  const w = quiz.words[quiz.idx];
  const pct = (quiz.idx / quiz.words.length * 100).toFixed(0);

  if (quiz.mode === 'fill') {
    area.innerHTML = `
      <div class="quiz-container">
        <div class="quiz-progress-bar"><div class="quiz-fill" style="width:${pct}%"></div></div>
        <div class="quiz-card">
          <div class="quiz-q">第 ${quiz.idx+1} 題 / 共 ${quiz.words.length} 題 &nbsp;|&nbsp; 填空題</div>
          <div class="quiz-word">${w.zh.replace(/^[^\u4e00-\u9fff]+/, '')}</div>
          <div class="quiz-ph">${w.pos}</div>
          <input id="fillInput" class="form-input" placeholder="請輸入英文單字..." style="margin:16px auto;max-width:280px;display:block;font-size:1.1rem;text-align:center"
            onkeydown="if(event.key==='Enter')submitFill()">
          <div style="display:flex;justify-content:center;gap:10px;margin-top:8px">
            <button class="btn btn-primary" onclick="submitFill()">確認</button>
          </div>
          <div id="fillFeedback" style="margin-top:12px;font-size:0.9rem"></div>
        </div>
        <div class="quiz-controls">
          <button class="btn" style="background:var(--bg);border:1.5px solid var(--border)" onclick="resetQuiz()">重新開始</button>
        </div>
      </div>`;
    setTimeout(() => document.getElementById('fillInput')?.focus(), 50);
    return;
  }

  // mc4 / mc4rev
  const allWords = state.words;
  const posGroup = p => /^v[it]?\.$/.test(p) ? 'v' : p;  // vi. vt. v. 視為同組
  const samePos = allWords.filter(x => x.id !== w.id && x.zh && posGroup(x.pos) === posGroup(w.pos));
  const wrongBase = samePos.length >= 3 ? samePos : allWords.filter(x => x.id !== w.id && x.zh);
  let wrongPool = wrongBase.sort(() => Math.random()-0.5).slice(0, 3);
  let opts = [...wrongPool, w].sort(() => Math.random()-0.5);

  area.innerHTML = `
    <div class="quiz-container">
      <div class="quiz-progress-bar"><div class="quiz-fill" style="width:${pct}%"></div></div>
      <div class="quiz-card">
        <div class="quiz-q">第 ${quiz.idx+1} 題 / 共 ${quiz.words.length} 題</div>
        ${quiz.mode === 'mc4'
          ? `<div class="quiz-word">${w.en}</div><div class="quiz-ph">${w.ph || ''}</div>`
          : `<div class="quiz-word" style="font-size:1.5rem">${w.zh.replace(/^[^\u4e00-\u9fff]+/, '')}</div><div class="quiz-ph">${w.pos}</div>`
        }
        <div class="quiz-options">
          ${opts.map(o => `
            <button class="quiz-opt" onclick="selectOpt(this, ${o.id === w.id}, ${w.id}, ${o.id})">
              ${quiz.mode === 'mc4' ? o.zh : o.en.replace(/\[.*?\]/g,'').replace(/\s*\(.*?\)\s*/g,'').replace(/\s+\w{1,6}\.\s*$/,'').trim()}
            </button>
          `).join('')}
        </div>
        <div id="quizFeedback" style="margin-top:12px;font-size:0.88rem;color:var(--text-muted)"></div>
      </div>
      <div class="quiz-controls">
        <button class="btn" style="background:var(--bg);border:1.5px solid var(--border)" onclick="resetQuiz()">重新開始</button>
      </div>
    </div>`;
}

function selectOpt(btn, correct, wordId, chosenId) {
  const btns = document.querySelectorAll('.quiz-opt');
  btns.forEach(b => b.disabled = true);
  const w = quiz.words[quiz.idx];
  btns.forEach(b => {
    // find correct button
  });
  btn.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    // highlight correct
    btns.forEach(b => {
      // We'll re-render to highlight — just mark correct
    });
  }
  if (correct) quiz.score++;
  quiz.answers.push({ word: w, correct });
  const fb = document.getElementById('quizFeedback');
  if (fb) fb.textContent = correct ? '✓ 正確！' : `✗ 正確答案：${quiz.mode==='mc4'?w.zh:w.en}`;
  if (fb) fb.style.color = correct ? 'var(--accent)' : 'var(--danger)';
  setTimeout(() => { quiz.idx++; renderQuiz(); }, 1000);
}

function submitFill() {
  const input = document.getElementById('fillInput');
  if (!input) return;
  const val = input.value.trim().toLowerCase();
  const w = quiz.words[quiz.idx];
  const correct = val === w.en.toLowerCase();
  if (correct) quiz.score++;
  quiz.answers.push({ word: w, correct });
  input.disabled = true;
  const fb = document.getElementById('fillFeedback');
  if (fb) {
    fb.textContent = correct ? '✓ 正確！' : `✗ 正確答案：${w.en}`;
    fb.style.color = correct ? 'var(--accent)' : 'var(--danger)';
  }
  setTimeout(() => { quiz.idx++; renderQuiz(); }, 1200);
}

function renderQuizResult() {
  const area = document.getElementById('quizArea');
  const pct = Math.round(quiz.score / quiz.words.length * 100);
  const emoji = pct >= 90 ? '&#127942;' : pct >= 70 ? '&#127881;' : pct >= 50 ? '&#128077;' : '&#128214;';
  // save to history
  state.quizHistory.unshift({
    date: new Date().toLocaleDateString('zh-TW'),
    score: quiz.score,
    total: quiz.words.length,
    pct,
    mode: quiz.mode,
  });
  if (state.quizHistory.length > 20) state.quizHistory.pop();
  saveState();

  area.innerHTML = `
    <div class="quiz-container">
      <div class="quiz-result">
        <div style="font-size:3rem;margin-bottom:8px">${emoji}</div>
        <div class="result-score">${pct}%</div>
        <div class="result-label">${quiz.score} / ${quiz.words.length} 題答對</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="resetQuiz()">再測一次</button>
          <button class="btn" style="background:var(--bg);border:1.5px solid var(--border)" onclick="reviewWrong()">複習錯題</button>
        </div>
        <div style="margin-top:24px;text-align:left;max-height:240px;overflow-y:auto">
          ${quiz.answers.map(a => `
            <div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.85rem">
              <span style="color:${a.correct?'var(--accent)':'var(--danger)'}">${a.correct?'✓':'✗'}</span>
              <strong>${a.word.en}</strong> ${a.word.ph||''} — ${a.word.zh}
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
}

function resetQuiz() {
  document.getElementById('quizSetup').style.display = '';
  document.getElementById('quizArea').style.display = 'none';
}

function reviewWrong() {
  const wrong = quiz.answers.filter(a => !a.correct).map(a => a.word);
  if (!wrong.length) { notify('全部答對了！太厲害了！'); return; }
  quiz = { words: wrong, idx: 0, score: 0, mode: quiz.mode, answers: [] };
  renderQuiz();
}

function extractYouTubeId(url) {
  const m = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function addVideo() {
  const rawUrl = document.getElementById('videoUrl').value.trim();
  const title = document.getElementById('videoTitle').value.trim() || '未命名影片';
  const tag = document.getElementById('videoTag').value.trim() || '教學';
  if (!rawUrl) { notify('請輸入 YouTube 網址'); return; }
  const vid = extractYouTubeId(rawUrl);
  const embedUrl = vid ? `https://www.youtube.com/embed/${vid}` : rawUrl;
  state.videos.push({ id: Date.now(), url: embedUrl, title, tag, loaded: false });
  saveState();
  renderVideos();
  ['videoUrl','videoTitle','videoTag'].forEach(id => document.getElementById(id).value = '');

  sec.innerHTML = `

    </div>
    <div class="video-grid" id="channelVideoWrap"></div>

  `;

  // 預設選第一個學年

function doVideoSearch(q) {
  const ql = q.trim().toLowerCase();
  const resultsDiv = document.getElementById('videoSearchResults');
  const channelSection = document.getElementById('channelSection');
  const clearBtn = document.getElementById('videoSearchClear');
  const countEl = document.getElementById('videoSearchCount');

  if (!ql) {
    resultsDiv.style.display = 'none';
    channelSection.style.display = '';
    clearBtn.style.display = 'none';
    countEl.textContent = '';
    return;
  }

  clearBtn.style.display = 'inline';
  channelSection.style.display = 'none';

  // 搜尋課本單字影片（比對英文單字 + 中文意思 + 完整標題）
  const vocResults = [];
  channelPlaylists.forEach(pl => {
    pl.videos.forEach(v => {
      if (v.rawTitle.toLowerCase().includes(ql) || v.zh.includes(q.trim()) || v.word.includes(ql)) {
        vocResults.push({ ...v, playlist: pl.title, type: 'vocab' });
      }
    });
  });

  // 搜尋學測字彙影片（比對標題 + 選項描述）
  const sapResults = [];
  sapPlaylists.forEach(pl => {
    pl.videos.forEach(v => {
      if (v.title.toLowerCase().includes(ql) || v.description.toLowerCase().includes(ql)) {
        sapResults.push({ ...v, playlistTitle: pl.title, year: pl.year, type: 'sap' });
      }
    });
  });

  const total = vocResults.length + sapResults.length;
  countEl.textContent = total ? `共 ${total} 筆` : '找不到結果';

  if (!total) {
    resultsDiv.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>找不到相關影片，請換個關鍵字試試</p></div>';
    resultsDiv.style.display = '';
    return;
  }

  const vocHtml = vocResults.slice(0, 40).map(v => `
    <a class="vsr-item" href="${v.url}" target="_blank">
      <div class="vsr-thumb"><img src="https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg" alt="${v.rawTitle}"></div>
      <div class="vsr-info">
        <div class="vsr-title"><span class="vsr-badge vocab">單字</span>${v.rawTitle}</div>
        <div class="vsr-playlist">📂 ${v.playlist}</div>
      </div>
    </a>`).join('');

  const sapHtml = sapResults.slice(0, 20).map(v => `
    <a class="vsr-item" href="${v.url}" target="_blank">
      <div class="vsr-thumb"><img src="https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg" alt="${v.title}"></div>
      <div class="vsr-info">
        <div class="vsr-title"><span class="vsr-badge sap">${v.year} 年</span>第 ${v.index} 題</div>
        <div class="vsr-desc">${v.description.split('\n')[0].substring(0, 80)}</div>
        <div class="vsr-playlist">📂 ${v.playlistTitle}</div>
      </div>
    </a>`).join('');

  resultsDiv.innerHTML =
    (vocResults.length ? `<div style="font-size:0.82rem;font-weight:700;color:var(--primary);margin-bottom:8px">📖 課本單字（${vocResults.length} 筆${vocResults.length>40?'，顯示前 40 筆':''}）</div><div class="vsr-list">${vocHtml}</div>` : '') +
    (sapResults.length ? `<div style="font-size:0.82rem;font-weight:700;color:#1e3a5f;margin-bottom:8px">📚 學測字彙（${sapResults.length} 筆${sapResults.length>20?'，顯示前 20 筆':''}）</div><div class="vsr-list">${sapHtml}</div>` : '');
  resultsDiv.style.display = '';
}

function addPdf() {

function uploadPdf(input) {
  const file = input.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  state.pdfs.push({ id: Date.now(), name: file.name.replace('.pdf',''), url, desc: '本地上傳', local: true });
  saveState();
  renderPdfs();
  notify('PDF 已上傳!');

  const quizCount = state.quizHistory.length;
  const avgScore = quizCount ? Math.round(state.quizHistory.reduce((s,q)=>s+q.pct,0)/quizCount) : null;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statLearned').textContent = learned;
  document.getElementById('statStarred').textContent = starred;
  document.getElementById('statQuizzes').textContent = quizCount;
  document.getElementById('statAvgScore').textContent = avgScore !== null ? avgScore+'%' : '-';

// ══════════════════════════════════════════════════════
//  BUILD WORD BANK FROM VOCAB JSON
// ══════════════════════════════════════════════════════
function buildWordBankFromVocab() {
  const wordMap = new Map();  // key → entry（遇重複保留資料最完整的版本）
  let id = 10000;
  channelPlaylists.forEach(pl => {
    if (/國中|2000/.test(pl.title)) return;  // 排除國中2000單字播放清單
    pl.videos.forEach(v => {
      if (!v.videoId) return;
      const raw = v.rawTitle.replace(/^\d+\s+/, '');
      const posIdx = v.pos ? raw.indexOf(' ' + v.pos) : -1;
      const bracketIdx = raw.indexOf(' [');
      const zhIdx = raw.search(/[\u4e00-\u9fff]/);
      let cutIdx = -1;
      if (posIdx > 0 && bracketIdx > 0) cutIdx = Math.min(posIdx, bracketIdx);
      else if (posIdx > 0) cutIdx = posIdx;
      else if (bracketIdx > 0) cutIdx = bracketIdx;
      else if (zhIdx > 0) cutIdx = zhIdx;
      const rawEn = cutIdx > 0 ? raw.substring(0, cutIdx).trim() : raw.trim();
      const en = rawEn
        .replace(/\[.*?\]/g, '')
        .replace(/\s*\(.*?\)\s*/g, '')
        .replace(/\s+\w{1,6}\.\s*$/, '')
        .trim();
      if (!en || !/[A-Za-z]/.test(en)) return;
      const key = en.toLowerCase();
      // 擷取中譯：直接從原始標題找第一個 CJK 字
      const zhRawIdx = v.rawTitle.search(/[\u4e00-\u9fff]/);
      const zh = zhRawIdx >= 0 ? v.rawTitle.substring(zhRawIdx).trim() : '';
      // 擷取音標
      let ph = '';
      if (posIdx > 0) {
        const phMatch = raw.substring(0, posIdx).match(/\[([^\]]+)\]/);
        if (phMatch) ph = '[' + phMatch[1] + ']';
      }
      if (!ph) {
        const phMatch = raw.match(/\[([^\]]*[ˈˌæɛɪɔʊəɑɒʌɜːiuaɪaʊeɪ][^\]]*)\]/);
        if (phMatch) ph = '[' + phMatch[1] + ']';
      }
      const pos = v.pos || (/\s/.test(en) ? 'phr.' : '');  // 多字詞組自動標為 phr.
      const entry = { id: 0, en, ph, pos, zh, ex: '', topic: '', videoId: v.videoId, videoUrl: v.url || `https://www.youtube.com/watch?v=${v.videoId}` };
      const existing = wordMap.get(key);
      // 保留資料較完整的版本（有 zh 或 ph 或 pos 優先）
      if (!existing || (!existing.zh && zh) || (!existing.ph && ph) || (!existing.pos && v.pos)) {
        entry.id = existing ? existing.id : id++;
        wordMap.set(key, entry);
      }
    });
  });
  // 套用手動補充資料
  wordMap.forEach((entry, key) => {
    const sup = WORD_SUPPLEMENTS[key];
    if (sup) {
      if (sup.ph && !entry.ph) entry.ph = sup.ph;
      if (sup.pos && !entry.pos) entry.pos = sup.pos;
      if (sup.zh && !entry.zh) entry.zh = sup.zh;
    }
  });
  return Array.from(wordMap.values());
}

// ══════════════════════════════════════════════════════
//  AUTO-FILL MISSING DATA FROM FREE DICTIONARY API
// ══════════════════════════════════════════════════════
const POS_MAP = { noun:'n.', verb:'v.', adjective:'adj.', adverb:'adv.', preposition:'prep.', conjunction:'conj.', pronoun:'pron.', interjection:'interj.' };
const DICT_CACHE_KEY = 'dictFetched';

async function autoFillMissingData() {
  const fetched = JSON.parse(localStorage.getItem(DICT_CACHE_KEY) || '{}');
  const missing = state.words.filter(w => (!w.ph || !w.pos || !w.zh) && !fetched[w.en.toLowerCase()]);
  if (!missing.length) return;

  let updated = false;
  for (const w of missing) {
    const firstWord = w.en.split(/\s+/)[0];
    const key = w.en.toLowerCase();
    fetched[key] = true;
    try {
      // 1. Free Dictionary API → 音標 + 詞性
      const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(firstWord)}`);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data[0]) {
          if (!w.ph) {
            const ph = data[0].phonetic || (data[0].phonetics || []).find(p => p.text)?.text || '';
            if (ph) { w.ph = ph; updated = true; }
          }
          if (!w.pos && data[0].meanings?.[0]) {
            const pos = POS_MAP[data[0].meanings[0].partOfSpeech] || '';
            if (pos) { w.pos = pos; updated = true; }
          }
        }
      }
      await new Promise(r => setTimeout(r, 100));

      // 2. MyMemory API → 中文翻譯
      if (!w.zh) {
        const tr = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(w.en)}&langpair=en|zh-TW`);
        if (tr.ok) {
          const td = await tr.json();
          const zh = td?.responseData?.translatedText || '';
          if (zh && /[\u4e00-\u9fff]/.test(zh)) { w.zh = zh; updated = true; }
        }
        await new Promise(r => setTimeout(r, 150));
      }
    } catch { /* 忽略個別失敗 */ }

    // 每 10 字存一次進度
    if (updated && Object.keys(fetched).length % 10 === 0) {
      saveState(); renderVocab(); updateSidebarCounts(); updated = false;
    }
  }
  localStorage.setItem(DICT_CACHE_KEY, JSON.stringify(fetched));
  if (updated) { saveState(); renderVocab(); updateSidebarCounts(); }
}

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
loadVideoData().then(() => {
  const vocabWords = buildWordBankFromVocab();
  loadState(vocabWords);
  renderVocab();
  renderVideos();
  renderPdfs();
  setTimeout(autoFillMissingData, 1500);  // 背景補充缺少的音標、詞性、中文翻譯
});
</script>
