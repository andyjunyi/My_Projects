<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>單字島 · 遊戲化養成風</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    background: #e8f5e9;
    color: #2e7d32;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 420px;
    padding: 16px;
  }
  /* 角色 + 進度 */
  .character-bar {
    background: #fff;
    border-radius: 24px 24px 24px 24px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(46,125,50,0.08);
    margin-bottom: 20px;
  }
  .character-bar .char {
    font-size: 52px;
    width: 64px;
    text-align: center;
  }
  .character-bar .info {
    flex: 1;
  }
  .character-bar .info .name {
    font-size: 16px;
    font-weight: 700;
    color: #1b5e20;
  }
  .character-bar .info .level {
    font-size: 12px;
    color: #66bb6a;
    margin-bottom: 6px;
  }
  .xp-bar-bg {
    width: 100%;
    height: 8px;
    background: #e8f5e9;
    border-radius: 8px;
    overflow: hidden;
  }
  .xp-bar-fill {
    width: 67%;
    height: 100%;
    background: linear-gradient(90deg, #66bb6a, #43a047);
    border-radius: 8px;
    transition: width 0.5s;
  }
  .character-bar .coins {
    font-size: 14px;
    font-weight: 700;
    color: #f9a825;
    text-align: center;
  }
  .character-bar .coins span { display: block; font-size: 10px; color: #a5d6a7; font-weight: 400; }

  /* 每日任務 */
  .quest-banner {
    background: linear-gradient(135deg, #a5d6a7, #66bb6a);
    border-radius: 20px;
    padding: 18px;
    color: #1b5e20;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .quest-banner .left .title {
    font-size: 16px;
    font-weight: 800;
  }
  .quest-banner .left .sub {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 2px;
  }
  .quest-banner .badge {
    background: #1b5e20;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
  }

  /* 地圖格子 */
  .map-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .map-node {
    background: #fff;
    border-radius: 16px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(46,125,50,0.06);
    cursor: pointer;
    transition: transform 0.12s;
  }
  .map-node:active { transform: scale(0.95); }
  .map-node .icon { font-size: 30px; }
  .map-node .label { font-size: 12px; font-weight: 600; color: #388e3c; margin-top: 4px; }
  .map-node .sub { font-size: 10px; color: #81c784; }
  .map-node.locked { opacity: 0.4; }

  /* 道具欄 */
  .items-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .item-slot {
    flex: 1;
    background: #fff;
    border-radius: 12px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    border: 1px solid #c8e6c9;
  }
  .item-slot .icon { font-size: 22px; }
  .item-slot .lbl { font-size: 10px; color: #558b2f; margin-top: 2px; }
  .item-slot .count { font-size: 11px; color: #689f38; font-weight: 600; }

  /* 冒險日誌 */
  .log-section .title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    color: #2e7d32;
  }
  .log-section .title a { font-size: 12px; color: #66bb6a; text-decoration: none; }
  .log-entry {
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    border: 1px solid #c8e6c9;
  }
  .log-entry .en { font-size: 14px; font-weight: 600; color: #1b5e20; }
  .log-entry .zh { font-size: 11px; color: #81c784; }
  .log-entry .xp { font-size: 12px; font-weight: 700; color: #66bb6a; }
</style>
</head>
<body>
<div class="container">
  <!-- 角色 -->
  <div class="character-bar">
    <div class="char">🧙</div>
    <div class="info">
      <div class="name">單字法師</div>
      <div class="level">Lv. 7 · 見習魔法使</div>
      <div class="xp-bar-bg"><div class="xp-bar-fill"></div></div>
    </div>
    <div class="coins">🪙 1,280<span>金幣</span></div>
  </div>

  <!-- 每日 -->
  <div class="quest-banner">
    <div class="left">
      <div class="title">📜 每日任務</div>
      <div class="sub">完成 10 題獲得額外經驗值</div>
    </div>
    <div class="badge">+50 XP</div>
  </div>

  <!-- 地圖 -->
  <div class="map-grid">
    <div class="map-node"><div class="icon">🃏</div><div class="label">翻牌</div><div class="sub">記憶</div></div>
    <div class="map-node"><div class="icon">⌨️</div><div class="label">打字</div><div class="sub">拼字</div></div>
    <div class="map-node"><div class="icon">🎯</div><div class="label">選擇</div><div class="sub">四選一</div></div>
    <div class="map-node"><div class="icon">🧩</div><div class="label">拼字</div><div class="sub">重組</div></div>
    <div class="map-node"><div class="icon">🏃</div><div class="label">馬拉松</div><div class="sub">無限</div></div>
    <div class="map-node locked"><div class="icon">🔒</div><div class="label">魔王關</div><div class="sub">Lv.10 解鎖</div></div>
  </div>

  <!-- 道具 -->
  <div class="items-row">
    <div class="item-slot"><div class="icon">💖</div><div class="lbl">愛心</div><div class="count">×5</div></div>
    <div class="item-slot"><div class="icon">⏰</div><div class="lbl">加時</div><div class="count">×3</div></div>
    <div class="item-slot"><div class="icon">💡</div><div class="lbl">提示</div><div class="count">×8</div></div>
    <div class="item-slot"><div class="icon">📕</div><div class="lbl">錯誤本</div><div class="count">12</div></div>
  </div>

  <!-- 冒險日誌 -->
  <div class="log-section">
    <div class="title">
      <span>📖 冒險日誌</span>
      <a href="#">全部 →</a>
    </div>
    <div class="log-entry">
      <div><div class="en">adventure</div><div class="zh">冒險 (名)</div></div>
      <div class="xp">+8 XP</div>
    </div>
    <div class="log-entry">
      <div><div class="en">beautiful</div><div class="zh">美麗的 (形)</div></div>
      <div class="xp">+6 XP</div>
    </div>
    <div class="log-entry">
      <div><div class="en">knowledge</div><div class="zh">知識 (名)</div></div>
      <div class="xp">+10 XP</div>
    </div>
  </div>
</div>
</body>
</html>
