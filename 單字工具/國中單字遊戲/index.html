<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字島 · 冒險地圖</title>
<link rel="stylesheet" href="style.css">
<style>
  .filter-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .filter-bar h2 { font-size: 22px; font-weight: 700; }
  .filter-bar select { min-width: 140px; }

  /* 任務列表在側欄的精簡版 */
  .quest-list { list-style: none; }
  .quest-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--glass-border);
  }
  .quest-item:last-child { border-bottom: none; }
  .quest-item .left { display: flex; align-items: center; gap: 10px; }
  .quest-item .left .qicon { font-size: 20px; }
  .quest-item .txt .title { font-size: 13px; font-weight: 600; }
  .quest-item .txt .prog { font-size: 11px; color: var(--green-200); }
  .quest-item .reward { font-size: 13px; font-weight: 700; color: var(--gold); cursor: pointer; }
  .quest-item.done .reward { color: var(--green-500); }
  .quest-item .claim-btn {
    background: var(--gold);
    color: #333;
    border: none;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  .word-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--glass-border);
    cursor: pointer;
  }
  .word-row:last-child { border-bottom: none; }
  .word-row .en { font-size: 14px; font-weight: 600; }
  .word-row .zh { font-size: 11px; color: var(--green-200); }

  /* 歡迎新手提示 */
  .welcome-tip {
    background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .welcome-tip .close {
    margin-left: auto;
    cursor: pointer;
    opacity: 0.5;
    font-size: 18px;
  }
</style>
</head>
<body>
<div class="app">
  <!-- Top Bar -->
  <div id="topBar" class="top-bar"></div>

  <!-- Welcome Tip -->
  <div id="welcomeTip" class="welcome-tip fade-in" style="display:none;">
    <span>👋</span>
    <span>點擊地圖上的模式開始冒險！每天完成任務可獲得 XP 升級 🧙</span>
    <span class="close" onclick="document.getElementById('welcomeTip').style.display='none'">✕</span>
  </div>

  <!-- Main -->
  <div class="main-content">
    <!-- Map -->
    <div class="map-panel panel fade-in">
      <div class="filter-bar">
        <h2>🗺️ 冒險地圖</h2>
        <select id="levelFilter" onchange="filterModes()">
          <option value="all">全部單字</option>
          <option value="1">國一單字</option>
          <option value="2">國二單字</option>
          <option value="3">國三單字</option>
          <option value="exam">會考總複習</option>
        </select>
      </div>
      <div class="grid-3" id="modeGrid">
        <div class="card" onclick="startGame('memory')">
          <div class="icon">🃏</div>
          <div class="label">翻牌配對</div>
          <div class="sub">記憶力考驗</div>
          <div class="desc">翻開兩張牌，配對中英文</div>
        </div>
        <div class="card" onclick="startGame('type')">
          <div class="icon">⌨️</div>
          <div class="label">打字挑戰</div>
          <div class="sub">限時拼字</div>
          <div class="desc">看中文，限時打出英文單字</div>
        </div>
        <div class="card" onclick="startGame('quiz')">
          <div class="icon">🎯</div>
          <div class="label">四選一</div>
          <div class="sub">快問快答</div>
          <div class="desc">四個選項選出正確答案</div>
        </div>
        <div class="card" onclick="startGame('scramble')">
          <div class="icon">🧩</div>
          <div class="label">拼字遊戲</div>
          <div class="sub">字母重組</div>
          <div class="desc">把打亂的字母排回單字</div>
        </div>
        <div class="card" onclick="startGame('marathon')">
          <div class="icon">🏃</div>
          <div class="label">單字馬拉松</div>
          <div class="sub">無限挑戰</div>
          <div class="desc">混合題型，答錯即結束</div>
        </div>
        <div class="card boss locked" id="bossNode">
          <div class="icon">🐉</div>
          <div class="label">魔王關卡</div>
          <div class="sub">Lv.10 解鎖</div>
          <div class="desc">擊敗魔王，獲得稀有獎勵</div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="side-panel">
      <!-- Inventory -->
      <div class="panel fade-in">
        <div class="panel-title">🎒 道具欄</div>
        <div class="grid-2" id="inventoryGrid">
          <div class="inv-item card" style="padding:12px;cursor:default;"><div class="icon" style="font-size:28px;">💖</div><div class="lbl">愛心</div><div id="invHeart" class="sub">× 5</div></div>
          <div class="inv-item card" style="padding:12px;cursor:default;"><div class="icon" style="font-size:28px;">⏰</div><div class="lbl">加時券</div><div id="invTime" class="sub">× 3</div></div>
          <div class="inv-item card" style="padding:12px;cursor:default;"><div class="icon" style="font-size:28px;">💡</div><div class="lbl">提示</div><div id="invHint" class="sub">× 8</div></div>
          <div class="inv-item card" style="padding:12px;cursor:pointer;" onclick="navigate('error-book.html')"><div class="icon" style="font-size:28px;">📕</div><div class="lbl">錯誤本</div><div id="invError" class="sub">0 題</div></div>
        </div>
      </div>

      <!-- Daily Quests -->
      <div class="panel fade-in">
        <div class="panel-title">📜 每日任務</div>
        <div class="quest-list" id="questList"></div>
      </div>

      <!-- Recent Words -->
      <div class="panel fade-in">
        <div class="panel-title" style="display:flex;justify-content:space-between;">
          <span>📖 最近學習</span>
          <span style="font-size:11px;cursor:pointer;" onclick="navigate('wordbook.html')">查看全部 →</span>
        </div>
        <div id="recentWords"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active"><div class="icon">🏠</div><div class="lbl">冒險</div></div>
    <div class="nav-item" onclick="navigate('wordbook.html')"><div class="icon">📚</div><div class="lbl">單字本</div></div>
    <div class="nav-item" onclick="navigate('achievements.html')"><div class="icon">🏆</div><div class="lbl">成就</div></div>
    <div class="nav-item" onclick="navigate('analysis.html')"><div class="icon">📊</div><div class="lbl">分析</div></div>
    <div class="nav-item" onclick="navigate('settings.html')"><div class="icon">⚙️</div><div class="lbl">設定</div></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* ===== 主頁初始化 ===== */
document.addEventListener('DOMContentLoaded', () => {
  const p = getPlayer();
  updateTopBar(p);
  updateInventory(p);
  updateQuests(p);
  updateRecentWords(p);
  updateBossNode(p);
  checkWelcome(p);
});

function checkWelcome(p) {
  if (p.totalCorrect + p.totalWrong === 0) {
    document.getElementById('welcomeTip').style.display = 'flex';
  }
}

function updateInventory(p) {
  document.getElementById('invHeart').textContent = '× ' + p.hearts;
  document.getElementById('invTime').textContent = '× ' + p.timeItems;
  document.getElementById('invHint').textContent = '× ' + p.hints;
  document.getElementById('invError').textContent = p.errorWords.length + ' 題';
}

function updateQuests(p) {
  checkDaily(p);
  const list = document.getElementById('questList');
  list.innerHTML = '';
  for (const q of DAILY_QUESTS) {
    const done = isQuestDone(p, q.id);
    const claimed = p.dailyProgress[q.id] < 0;
    const prog = Math.abs(p.dailyProgress[q.id] || 0);
    const li = document.createElement('div');
    li.className = 'quest-item' + (done ? ' done' : '');
    li.innerHTML = `
      <div class="left">
        <span class="qicon">${q.icon}</span>
        <div class="txt">
          <div class="title">${q.title}</div>
          <div class="prog">進度 ${Math.min(prog, q.need)}/${q.need}</div>
        </div>
      </div>
      <div>
        ${claimed ? '<span style="color:var(--green-500);font-size:12px;">✅ 已領</span>'
          : done ? `<button class="claim-btn" onclick="claimQuest(getPlayer(),'${q.id}');updateQuests(getPlayer());updateTopBar(getPlayer())">領取 +${q.xp}XP</button>`
          : `<span class="reward">+${q.xp} XP</span>`}
      </div>
    `;
    list.appendChild(li);
  }
}

function updateRecentWords(p) {
  const recent = load('recentWords', []);
  const container = document.getElementById('recentWords');
  if (recent.length === 0) {
    container.innerHTML = '<div style="color:var(--green-200);font-size:13px;text-align:center;padding:12px;">開始玩遊戲就會顯示在這裡 📖</div>';
    return;
  }
  container.innerHTML = '';
  for (const w of recent.slice(0, 5)) {
    const item = WORD_DATA.find(d => d.w === w);
    if (!item) continue;
    const div = document.createElement('div');
    div.className = 'word-row';
    div.onclick = () => showWordDetail(item);
    div.innerHTML = `
      <div>
        <div class="en">${item.w}</div>
        <div class="zh">${item.z ? item.z.substring(0, 30) : ''}</div>
      </div>
    `;
    container.appendChild(div);
  }
}

function updateBossNode(p) {
  const node = document.getElementById('bossNode');
  if (p.level >= 10) {
    node.classList.remove('locked');
    node.onclick = () => navigate('game-boss.html');
  }
}

function showWordDetail(item) {
  showToast(`${item.w} ${item.k ? '[' + item.k + ']' : ''} : ${item.z || ''}`, '');
}

function startGame(mode) {
  const p = getPlayer();
  // 記錄遊玩模式（每日任務）
  if (!p.completedModes.includes(mode)) {
    p.completedModes.push(mode);
    updateQuest(p, 'play_3_modes');
    setPlayer(p);
  }
  navigate(`game-${mode}.html`);
}

function filterModes() {
  // 級別篩選用 session 傳遞
  const val = document.getElementById('levelFilter').value;
  sessionStorage.setItem('wordLevelFilter', val);
  showToast(`已切換至 ${document.getElementById('levelFilter').selectedOptions[0].text}`);
}
</script>
</body>
</html>
