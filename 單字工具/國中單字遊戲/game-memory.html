<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻牌配對 · 單字島</title>
<link rel="stylesheet" href="style.css">
<style>
  .app { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }
  .game-area { flex: 1; display: flex; flex-direction: column; }
  .game-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px; }
  .game-title { font-size:20px; font-weight:700; }
  .game-status { display:flex; gap:14px; font-size:15px; font-weight:600; }
  .game-content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:300px; width:100%; }
  .memory-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:640px; width:100%; margin:0 auto; }
  .memory-card {
    min-height:80px; background:var(--glass); border:2px solid var(--glass-border);
    border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:700; cursor:pointer; transition:all 0.2s; padding:10px 6px;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff;
  }
  .memory-card.flipped { background:rgba(255,255,255,0.15); border-color:var(--green-300); }
  .memory-card.matched { background:rgba(76,175,80,0.2); border-color:var(--green-500); cursor:default; opacity:0.5; }
  .memory-card.en { font-size:20px; letter-spacing:0.5px; }
  .memory-card.zh { font-size:14px; }
  .memory-pairs { font-size:16px; margin-bottom:16px; color:var(--green-200); text-align:center; }
  .result-panel { text-align:center; max-width:450px; width:100%; }
  .result-icon { font-size:64px; margin-bottom:8px; }
  .result-title { font-size:24px; font-weight:800; margin-bottom:20px; }
  .result-stats { margin-bottom:16px; }
  .rs-row { display:flex; gap:8px; margin-bottom:8px; }
  .rs-item { flex:1; background:var(--glass); border-radius:var(--radius-sm); padding:10px; }
  .rs-num { font-size:24px; font-weight:800; }
  .rs-lbl { font-size:11px; color:var(--green-200); }
  .result-reward {
    font-size:22px; font-weight:800; color:var(--gold); background:rgba(255,215,0,0.1);
    border-radius:var(--radius-md); padding:12px 24px; display:inline-flex; gap:24px; margin-bottom:20px;
  }
  .result-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 24px; border:none; border-radius:var(--radius-sm); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-primary { background:var(--green-500); color:#fff; }
  .btn-ghost { background:var(--glass); color:#fff; border:1px solid var(--glass-border); }
</style>
</head>
<body>
<div class="app">
  <div class="game-area panel" id="gameArea">
    <div class="game-header">
      <div class="game-title">🃏 翻牌配對</div>
      <div class="game-status">
        <span id="pairsDisplay">0 / 6 對</span>
        <span id="scoreDisplay">🏆 0</span>
        <span id="movesDisplay">🔄 0</span>
      </div>
    </div>
    <div id="gameContent" class="game-content"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
// ===== 獨立翻牌遊戲（無外部依賴）=====
let cards = [], flipped = [], matched = [], moves = 0, canFlip = true, startTime;
let pairs = [];

function startGame() {
  const words = [...WORD_DATA].sort(() => Math.random() - 0.5).slice(0, 6);
  pairs = words;
  cards = [];
  words.forEach(w => {
    const zh = w.z ? w.z.replace(/\(.+?\)/g, '').trim().substring(0, 15) : w.w;
    cards.push({ id: w.w + '_en', pairId: w.w, type: 'en', text: w.w });
    cards.push({ id: w.w + '_zh', pairId: w.w, type: 'zh', text: zh });
  });
  cards.sort(() => Math.random() - 0.5);
  flipped = []; matched = []; moves = 0; canFlip = true;
  startTime = Date.now();
  renderBoard();
}

function renderBoard() {
  const el = document.getElementById('gameContent');
  el.innerHTML = '<div class="memory-pairs">配對 ' + matched.length + ' / ' + pairs.length + ' 對</div>' +
    '<div class="memory-grid">' +
    cards.map((c, i) => {
      const isMatched = matched.indexOf(c.pairId) !== -1;
      const isFlipped = flipped.indexOf(i) !== -1;
      const cls = 'memory-card ' + c.type + (isMatched ? ' matched' : '') + (isFlipped ? ' flipped' : '');
      const txt = isMatched ? '✅' : (isFlipped ? c.text : '❓');
      return '<div class="' + cls + '" data-idx="' + i + '" onclick="flipCard(' + i + ')">' + txt + '</div>';
    }).join('') +
    '</div>';
  document.getElementById('pairsDisplay').textContent = matched.length + ' / ' + pairs.length + ' 對';
  document.getElementById('scoreDisplay').textContent = '🏆 ' + (matched.length * 20);
  document.getElementById('movesDisplay').textContent = '🔄 ' + moves;
}

function flipCard(idx) {
  if (!canFlip) return;
  if (flipped.indexOf(idx) !== -1) return;
  if (matched.indexOf(cards[idx].pairId) !== -1) return;
  if (flipped.length >= 2) return;
  
  flipped.push(idx);
  moves++;
  renderBoard();
  
  if (flipped.length === 2) {
    canFlip = false;
    const c1 = cards[flipped[0]], c2 = cards[flipped[1]];
    
    if (c1.pairId === c2.pairId && c1.type !== c2.type) {
      // 配對成功
      matched.push(c1.pairId);
      flipped = [];
      canFlip = true;
      renderBoard();
      
      if (matched.length >= pairs.length) {
        setTimeout(endGame, 500);
      }
    } else {
      // 配對失敗
      setTimeout(function() {
        flipped = [];
        canFlip = true;
        renderBoard();
      }, 900);
    }
  }
}

function endGame() {
  const timeSpent = Math.round((Date.now() - startTime) / 1000);
  const el = document.getElementById('gameContent');
  if (!el) return;
  
  try {
    // 儲存到 localStorage
    const p = JSON.parse(localStorage.getItem('wordquest_player')) || {
      level:1, xp:0, coins:0, totalCorrect:0, totalWrong:0,
      gamesPlayed:0, hearts:5, hints:3, timeItems:2, streak:0, maxStreak:0,
      errorWords:[], achievements:[], dailyDate:'', dailyProgress:{},
      completedModes:[], charId:'mage', name:'旅行者', maxHearts:5, createdAt:Date.now()
    };
    p.totalCorrect += matched.length;
    p.gamesPlayed++;
    p.coins += matched.length * 3;
    p.xp += matched.length * 10;
    while (p.level < 50) {
      const caps = [0,100,300,600,1000,1500,2100,2800,3600,4500,5500,6600,7800,9100,10500,12000,13600,15300,17100,19000,21000,23100,25300,27600,30000,32500,35100,37800,40600,43500,46500,49600,52800,56100,59500,63000,66600,70300,74100,78000,82000,86100,90300,94600,99000,103500,108100,112800,117600,122500];
      if (p.level < caps.length && p.xp >= caps[p.level]) { p.level++; }
      else break;
    }
    localStorage.setItem('wordquest_player', JSON.stringify(p));
  } catch(e) {}
  
  const xp = matched.length * 10;
  el.innerHTML =
    '<div class="result-panel">' +
      '<div class="result-icon">🌟</div>' +
      '<div class="result-title">全部配對完成！</div>' +
      '<div class="result-stats">' +
        '<div class="rs-row">' +
          '<div class="rs-item"><div class="rs-num">' + pairs.length + '</div><div class="rs-lbl">配對數</div></div>' +
          '<div class="rs-item"><div class="rs-num">' + moves + '</div><div class="rs-lbl">翻牌次數</div></div>' +
          '<div class="rs-item"><div class="rs-num">' + timeSpent + 's</div><div class="rs-lbl">用時</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="result-reward"><span>+' + xp + ' XP</span><span>🪙 ' + (matched.length * 3) + '</span></div>' +
      '<div class="result-actions">' +
        '<button class="btn btn-primary" onclick="startGame()">🔄 再玩一次</button>' +
        '<button class="btn btn-ghost" onclick="window.location.href=\'index.html\'">🏠 回冒險地圖</button>' +
      '</div>' +
    '</div>';
}

// 啟動
startGame();
</script>
</body>
</html>
