<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻牌配對 · 單字島</title>
<link rel="stylesheet" href="style.css">
<style>
  .app { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }
  .game-area { flex: 1; display: flex; flex-direction: column; }
  .game-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px; }
  .game-title { font-size:20px; font-weight:700; }
  .game-status { display:flex; gap:14px; font-size:15px; font-weight:600; }
  .game-content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:300px; width:100%; }
  .memory-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:640px; width:100%; margin:0 auto; }
  .memory-card {
    min-height:80px; background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.1);
    border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:700; cursor:pointer; transition:all 0.2s; padding:10px 6px;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff;
  }
  .memory-card.flipped { background:rgba(255,255,255,0.15); border-color:#81c784; }
  .memory-card.matched { background:rgba(76,175,80,0.2); border-color:#4caf50; cursor:default; opacity:0.5; }
  .memory-card.en { font-size:20px; letter-spacing:0.5px; }
  .memory-card.zh { font-size:14px; }
  .memory-pairs { font-size:16px; margin-bottom:16px; color:#a5d6a7; text-align:center; }
  .result-panel { text-align:center; max-width:450px; width:100%; }
  .result-icon { font-size:64px; margin-bottom:8px; }
  .result-title { font-size:24px; font-weight:800; margin-bottom:20px; color:#fff; }
  .result-stats { margin-bottom:16px; }
  .rs-row { display:flex; gap:8px; margin-bottom:8px; }
  .rs-item { flex:1; background:rgba(255,255,255,0.06); border-radius:10px; padding:10px; }
  .rs-num { font-size:24px; font-weight:800; color:#fff; }
  .rs-lbl { font-size:11px; color:#a5d6a7; }
  .result-reward {
    font-size:22px; font-weight:800; color:#ffd54f; background:rgba(255,215,0,0.1);
    border-radius:16px; padding:12px 24px; display:inline-flex; gap:24px; margin-bottom:20px;
  }
  .result-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 24px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-primary { background:#4caf50; color:#fff; }
  .btn-ghost { background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body>
<div class="app">
  <div class="game-area panel" id="gameArea">
    <div class="game-header">
      <div class="game-title">🃏 翻牌配對</div>
      <div class="game-status">
        <span id="pairsDisplay">0 / 6 對</span>
        <span id="scoreDisplay">🏆 0</span>
        <span id="movesDisplay">🔄 0</span>
      </div>
    </div>
    <div id="gameContent" class="game-content"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
/* === 純 ES5 翻牌遊戲（相容 iPad Safari）=== */
var cards = [], flipped = [], matched = [], moves = 0, canFlip = true, startTime;
var pairs = [];

function shuffleArray(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function startGame() {
  var shuffled = WORD_DATA.slice().sort(function() { return 0.5 - Math.random(); });
  var words = shuffled.slice(0, 6);
  pairs = words;
  cards = [];
  
  for (var w = 0; w < words.length; w++) {
    var wi = words[w];
    var zhText = wi.z || wi.w;
    zhText = zhText.replace(/\(.+?\)/g, '').trim().substring(0, 15);
    cards.push({ id: wi.w + '_en', pairId: wi.w, type: 'en', text: wi.w });
    cards.push({ id: wi.w + '_zh', pairId: wi.w, type: 'zh', text: zhText });
  }
  shuffleArray(cards);
  flipped = [];
  matched = [];
  moves = 0;
  canFlip = true;
  startTime = new Date().getTime();
  renderBoard();
}

function renderBoard() {
  var el = document.getElementById('gameContent');
  if (!el) return;
  
  var html = '<div class="memory-pairs">配對 ' + matched.length + ' / ' + pairs.length + ' 對</div>';
  html += '<div class="memory-grid">';
  
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    var isMatched = matched.indexOf(c.pairId) !== -1;
    var isFlipped = flipped.indexOf(i) !== -1;
    var cls = 'memory-card ' + c.type;
    if (isMatched) cls += ' matched';
    if (isFlipped) cls += ' flipped';
    var txt = isMatched ? '✅' : (isFlipped ? c.text : '❓');
    html += '<div class="' + cls + '" onclick="flipCard(' + i + ')">' + txt + '</div>';
  }
  
  html += '</div>';
  el.innerHTML = html;
  
  document.getElementById('pairsDisplay').innerHTML = matched.length + ' / ' + pairs.length + ' 對';
  document.getElementById('scoreDisplay').innerHTML = '🏆 ' + (matched.length * 20);
  document.getElementById('movesDisplay').innerHTML = '🔄 ' + moves;
}

function flipCard(idx) {
  if (!canFlip) return;
  if (flipped.indexOf(idx) !== -1) return;
  if (matched.indexOf(cards[idx].pairId) !== -1) return;
  if (flipped.length >= 2) return;
  
  flipped.push(idx);
  moves++;
  renderBoard();
  
  if (flipped.length === 2) {
    canFlip = false;
    var c1 = cards[flipped[0]];
    var c2 = cards[flipped[1]];
    
    if (c1.pairId === c2.pairId && c1.type !== c2.type) {
      matched.push(c1.pairId);
      flipped = [];
      canFlip = true;
      renderBoard();
      
      if (matched.length >= pairs.length) {
        setTimeout(function() { endGame(); }, 500);
      }
    } else {
      setTimeout(function() {
        flipped = [];
        canFlip = true;
        renderBoard();
      }, 900);
    }
  }
}

function endGame() {
  var elapsed = Math.round((new Date().getTime() - startTime) / 1000);
  var el = document.getElementById('gameContent');
  if (!el) return;
  
  /* 儲存玩家資料 */
  try {
    var pStr = localStorage.getItem('wordquest_player');
    var p = pStr ? JSON.parse(pStr) : {
      level:1, xp:0, coins:0, totalCorrect:0, totalWrong:0,
      gamesPlayed:0, hearts:5, hints:3, timeItems:2, streak:0, maxStreak:0,
      errorWords:[], achievements:[], dailyDate:'', dailyProgress:{},
      completedModes:[], charId:'mage', name:'旅行者', maxHearts:5, createdAt:Date.now()
    };
    p.totalCorrect += matched.length;
    p.gamesPlayed++;
    p.coins += matched.length * 3;
    p.xp += matched.length * 10;
    var caps = [0,100,300,600,1000,1500,2100,2800,3600,4500,5500,6600,7800,9100,10500,12000,13600,15300,17100,19000,21000,23100,25300,27600,30000,32500,35100,37800,40600,43500,46500,49600,52800,56100,59500,63000,66600,70300,74100,78000,82000,86100,90300,94600,99000,103500,108100,112800,117600,122500];
    while (p.level < 50 && caps.length > p.level && p.xp >= caps[p.level]) { p.level++; }
    localStorage.setItem('wordquest_player', JSON.stringify(p));
  } catch(e) {}
  
  var xp = matched.length * 10;
  el.innerHTML =
    '<div class="result-panel">' +
    '<div class="result-icon">🌟</div>' +
    '<div class="result-title">全部配對完成！</div>' +
    '<div class="result-stats">' +
    '<div class="rs-row">' +
    '<div class="rs-item"><div class="rs-num">' + pairs.length + '</div><div class="rs-lbl">配對數</div></div>' +
    '<div class="rs-item"><div class="rs-num">' + moves + '</div><div class="rs-lbl">翻牌次數</div></div>' +
    '<div class="rs-item"><div class="rs-num">' + elapsed + 's</div><div class="rs-lbl">用時</div></div>' +
    '</div></div>' +
    '<div class="result-reward"><span>+' + xp + ' XP</span><span>🪙 ' + (matched.length * 3) + '</span></div>' +
    '<div class="result-actions">' +
    '<button class="btn btn-primary" onclick="startGame()">🔄 再玩一次</button>' +
    '<button class="btn btn-ghost" onclick="window.location.href=\'index.html\'">🏠 回冒險地圖</button>' +
    '</div></div>';
}

startGame();
</script>
</body>
</html>
