<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>高考單字卡 · 線上產生器</title>
<script src="https://cdn.jsdelivr.net/npm/docx@9.7.0/dist/index.iife.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #eee;
    --text2: #aaa;
    --green: #4ade80;
    --blue: #60a5fa;
    --orange: #fb923c;
    --yellow: #fbbf24;
    --border: #2a2a4a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, var(--accent2), var(--card));
    padding: 32px 20px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .header .sub { color: var(--text2); font-size: 14px; }
  .content { padding: 20px 16px 40px; max-width: 600px; margin: 0 auto; }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .input-group input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border .2s;
  }
  .input-group input:focus { border-color: var(--accent); }
  .input-group button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .2s;
  }
  .input-group button:disabled { opacity: .4; cursor: not-allowed; }

  .match-info {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 16px;
    min-height: 20px;
  }

  /* Preview Card */
  .preview {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
    display: none;
  }
  .preview.show { display: block; }

  .pv-word {
    font-size: 24px;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 2px;
  }
  .pv-kk {
    font-size: 15px;
    color: var(--orange);
    margin-bottom: 12px;
  }

  .pv-section-title {
    font-size: 12px;
    color: var(--text2);
    font-weight: 600;
    margin: 16px 0 6px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }

  .pv-def {
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 4px;
  }
  .pv-pos-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    margin-right: 4px;
    background: rgba(96,165,250,.15);
    color: var(--blue);
  }

  .pv-ex-card {
    background: rgba(255,255,255,.03);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .pv-ex-en {
    font-size: 14px;
    color: var(--green);
    margin-bottom: 2px;
    line-height: 1.4;
  }
  .pv-ex-zh {
    font-size: 13px;
    color: var(--text2);
    font-style: italic;
  }

  .pv-syn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pv-syn-item {
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .pv-syn-item.syn { background: rgba(74,222,128,.1); color: var(--green); }
  .pv-syn-item.ant { background: rgba(233,69,96,.1); color: var(--accent); }
  .pv-syn-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 0 4px;
  }

  .pv-meta {
    margin-top: 14px;
    font-size: 12px;
    color: var(--text2);
    display: flex;
    gap: 12px;
  }
  .pv-meta span { background: rgba(255,255,255,.05); padding: 2px 8px; border-radius: 4px; }

  .btn-outline {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
    width: 100%;
    margin-top: 16px;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--text); }

  .batch-area {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    resize: vertical;
    outline: none;
    min-height: 80px;
    margin-bottom: 8px;
    font-family: inherit;
  }
  .batch-area:focus { border-color: var(--accent); }

  details summary { cursor:pointer; color:var(--text2); font-size:13px; padding:4px 0; }
</style>
</head>
<body>

<div class="header">
  <h1>📖 高考單字卡產生器</h1>
</div>

<div class="content">

  <div class="input-group">
    <input type="text" id="wordInput" placeholder="輸入單字，如 adapt" autocomplete="off"
           onkeydown="if(event.key==='Enter')lookup()">
    <button onclick="lookup()">🔍 查詢</button>
  </div>

  <div class="match-info" id="matchInfo"></div>

  <div class="preview" id="preview">
    <!-- Word -->
    <div class="pv-word" id="pvWord"></div>
    <div class="pv-kk" id="pvKk"></div>

    <!-- Definitions -->
    <div class="pv-section-title">📖 釋義</div>
    <div id="pvDefs"></div>

    <!-- Examples -->
    <div class="pv-section-title">💬 例句</div>
    <div id="pvExamples"></div>

    <!-- Collocations -->
    <div class="pv-section-title" id="pvColTitle" style="display:none">🔗 常見搭配片語</div>
    <div id="pvCols"></div>

    <!-- Synonyms & Antonyms -->
    <div class="pv-section-title" id="pvSynTitle" style="display:none">🔗 同反義詞</div>
    <div id="pvSyns"></div>

    <!-- Meta info -->
    <div class="pv-meta" id="pvMeta" style="display:none"></div>

    <button class="btn-outline" onclick="downloadSingle()">⬇️ 下載 Word 講義</button>
  </div>

  <!-- Batch mode -->
  <details style="margin-bottom:16px">
    <summary>📋 批次產生（每行一個單字）</summary>
    <textarea class="batch-area" id="batchInput" placeholder="adapt&#10;adopt&#10;affect&#10;..."></textarea>
    <button class="btn-outline" onclick="downloadBatch()" id="batchBtn" style="margin-top:0">⬇️ 批次下載全部 Word 講義</button>
    <div class="match-info" id="batchInfo"></div>
  </details>

</div>

<script>
let WORDS = [];
let WORDS_READY = false;

function setInfo(msg) {
  document.getElementById('matchInfo').textContent = msg;
}

// Load both parts in parallel
Promise.all([
  fetch('words_p1.json').then(r => r.json()),
  fetch('words_p2.json').then(r => r.json())
])
  .then(([p1, p2]) => {
    WORDS = p1.concat(p2);
    WORDS_READY = true;
    setInfo('✅ 已載入 ' + WORDS.length + ' 個單字');
  })
  .catch(() => {
    // Fallback: try loading the single file
    fetch('words.json')
      .then(r => r.json())
      .then(data => {
        WORDS = data;
        WORDS_READY = true;
        setInfo('✅ 已載入 ' + data.length + ' 個單字');
      })
      .catch(() => {
        setInfo('⚠️ 資料載入失敗，請重整頁面');
      });
  });

function findWord(word) {
  if (!WORDS_READY) return null;
  const q = word.trim().toLowerCase();
  return WORDS.find(w => w.w.toLowerCase() === q) || null;
}

function lookup() {
  const input = document.getElementById('wordInput');
  const preview = document.getElementById('preview');
  const info = document.getElementById('matchInfo');
  const q = input.value.trim();

  if (!q) {
    preview.classList.remove('show');
    info.textContent = WORDS_READY ? '' : '⏳ 載入中 (4.8MB + 3.3MB)...';
    return;
  }

  if (!WORDS_READY) {
    info.textContent = '⏳ 資料載入中，請稍後...';
    return;
  }

  const found = findWord(q);
  if (!found) {
    preview.classList.remove('show');
    info.textContent = '❌ 找不到「' + q + '」';
    return;
  }

  preview.classList.add('show');
  info.textContent = '';
  input.value = '';

  // Word
  document.getElementById('pvWord').textContent = found.w;

  // KK
  document.getElementById('pvKk').textContent = found.k ? '美 [ ' + found.k + ' ]' : '';

  // Definitions with POS badges
  const defsEl = document.getElementById('pvDefs');
  defsEl.innerHTML = '';
  if (found.d && found.d.length) {
    found.d.forEach(def => {
      const el = document.createElement('div');
      el.className = 'pv-def';
      if (def.p) {
        const badge = document.createElement('span');
        badge.className = 'pv-pos-badge';
        badge.textContent = def.p;
        el.appendChild(badge);
      }
      const txt = document.createTextNode(def.m);
      el.appendChild(txt);
      defsEl.appendChild(el);
    });
  }

  // Examples with POS
  const exEl = document.getElementById('pvExamples');
  exEl.innerHTML = '';
  if (found.e && found.e.length) {
    found.e.forEach(ex => {
      const card = document.createElement('div');
      card.className = 'pv-ex-card';

      const enEl = document.createElement('div');
      enEl.className = 'pv-ex-en';
      let enText = ex.e;
      if (ex.p) {
        enText = enText + ' (' + ex.p + ')';
      }
      enEl.textContent = enText;
      card.appendChild(enEl);

      if (ex.z) {
        const zhEl = document.createElement('div');
        zhEl.className = 'pv-ex-zh';
        zhEl.textContent = ex.z;
        card.appendChild(zhEl);
      }

      exEl.appendChild(card);
    });
  }

  // Collocations section (between examples and synonyms)
  const colEl = document.getElementById('pvCols');
  const colTitle = document.getElementById('pvColTitle');
  colEl.innerHTML = '';
  if (found.col && found.col.length) {
    colTitle.style.display = 'block';
    found.col.forEach(c => {
      const el = document.createElement('div');
      el.style.cssText = 'font-size:13px;line-height:1.7;margin-bottom:2px';
      el.innerHTML = '<span style="color:var(--orange)">•</span> ' +
        '<span style="color:#ddd">' + c.phrase + '</span>' +
        ' <span style="color:var(--text2)">→ ' + c.zh + '</span>';
      colEl.appendChild(el);
    });
  } else {
    colTitle.style.display = 'none';
  }

  // Synonyms & Antonyms — one line, comma separated
  const synEl = document.getElementById('pvSyns');
  const synTitle = document.getElementById('pvSynTitle');
  synEl.innerHTML = '';
  const hasSyn = found.syn && found.syn.length;
  const hasAnt = found.ant && found.ant.length;

  if (hasSyn || hasAnt) {
    synTitle.style.display = 'block';
    const el = document.createElement('div');
    el.style.cssText = 'font-size:13px;line-height:1.7';
    const parts = [];
    if (hasSyn) {
      const words = found.syn.map(s => s.w + (s.m ? ' ' + s.m : '')).join(', ');
      parts.push('<span style="color:var(--accent)">(同) ' + words + '</span>');
    }
    if (hasAnt) {
      const words = found.ant.map(a => a.w + (a.m ? ' ' + a.m : '')).join(', ');
      parts.push('<span style="color:var(--green)"> (反) ' + words + '</span>');
    }
    el.innerHTML = parts.join('　');
    synEl.appendChild(el);
  } else {
    synTitle.style.display = 'none';
  }

  // Meta info
  const metaEl = document.getElementById('pvMeta');
  metaEl.innerHTML = '';
  if (found.src || found.tag) {
    metaEl.style.display = 'flex';
    if (found.src) {
      const s = document.createElement('span');
      s.textContent = '📡 ' + found.src;
      metaEl.appendChild(s);
    }
    if (found.tag) {
      const t = document.createElement('span');
      t.textContent = '🏷️ ' + found.tag;
      metaEl.appendChild(t);
    }
  }
}

async function downloadSingle() {
  const wordEl = document.getElementById('pvWord');
  const word = wordEl.textContent;
  if (!word) return;
  const found = findWord(word);
  if (!found) return;
  await generateAndDownload(found, found.w + '.docx');
}

async function downloadBatch() {
  const text = document.getElementById('batchInput').value;
  const words = text.split('\n').map(s => s.trim()).filter(Boolean);
  if (!words.length) return;

  const btn = document.getElementById('batchBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 產生中...';
  const info = document.getElementById('batchInfo');
  let success = 0, errors = [];

  for (const word of words) {
    const found = findWord(word);
    if (!found) { errors.push(word); continue; }
    await generateAndDownload(found, found.w + '.docx');
    success++;
  }

  btn.disabled = false;
  btn.textContent = '⬇️ 批次下載全部 Word 講義';
  info.textContent = errors.length
    ? '✅ 成功 ' + success + ' 個，找不到：' + errors.join(', ')
    : '✅ 已下載 ' + success + ' 個檔案';
}

// Colors
const BLUE = '215E99';
const ORANGE = 'BF4E14';
const GREEN = '4EA72E';
const GRAY = '666666';

async function generateAndDownload(data, filename) {
  const { Document, Packer, Paragraph, TextRun } = window.docx;
  const children = [];

  // Line 1: Word + KK + POS badge + first definition
  const line1 = [];
  line1.push(new TextRun({ text: data.w, bold: true, size: 40, font: 'Arial Unicode MS', color: BLUE }));
  if (data.k) {
    line1.push(new TextRun({ text: '  [' + data.k + ']', size: 32, font: 'Arial Unicode MS', color: ORANGE }));
  }
  if (data.d && data.d[0]) {
    line1.push(new TextRun({ text: '  ', size: 28, font: 'Arial Unicode MS' }));
    if (data.d[0].p) {
      line1.push(new TextRun({ text: '(' + data.d[0].p + ')', size: 26, font: 'Arial Unicode MS', color: GRAY, bold: true }));
    }
    line1.push(new TextRun({ text: '  ' + data.d[0].m, size: 28, font: 'Arial Unicode MS' }));
  }
  children.push(new Paragraph({ spacing: { after: 0 }, children: line1 }));

  // Extra definitions (d[1+]) — separate lines
  if (data.d && data.d.length > 1) {
    for (let i = 1; i < data.d.length; i++) {
      const def = data.d[i];
      children.push(new Paragraph({
        spacing: { before: 30, after: 0 },
        children: [
          new TextRun({ text: '(' + def.p + ') ', size: 26, font: 'Arial Unicode MS', color: GRAY, bold: true }),
          new TextRun({ text: def.m, size: 26, font: 'Arial Unicode MS', color: GRAY })
        ]
      }));
    }
  }

  // All examples — template-style numbered pairs
  if (data.e && data.e.length) {
    data.e.forEach((ex, i) => {
      const enText = ex.p ? ex.e + ' (' + ex.p + ')' : ex.e;
      // English sentence
      children.push(new Paragraph({
        spacing: { before: 120, line: 180 },
        indent: { left: 540, hanging: 340 },
        children: [new TextRun({ text: '▶ ' + enText, size: 28, font: 'Arial Unicode MS' })]
      }));
      // Chinese translation
      if (ex.z) {
        children.push(new Paragraph({
          spacing: { after: 0, line: 180 },
          indent: { left: 520 },
          children: [new TextRun({ text: ex.z, size: 26, font: 'Arial Unicode MS', color: GREEN })]
        }));
      }
    });
  }

  // Collocations — template-style with indent
  if (data.col && data.col.length) {
    children.push(new Paragraph({
      spacing: { before: 160 },
      children: [
        new TextRun({ text: '【常見搭配片語】', size: 22, font: 'Arial Unicode MS', bold: true, color: GRAY }),
      ]
    }));
    data.col.forEach(c => {
      children.push(new Paragraph({
        spacing: { before: 40, after: 0 },
        indent: { left: 567, hanging: 340 },
        children: [
          new TextRun({ text: '▶ ' + c.phrase, size: 28, font: 'Arial Unicode MS', color: ORANGE }),
          new TextRun({ text: '  → ' + c.zh, size: 28, font: 'Arial Unicode MS', color: GRAY })
        ]
      }));
    });
  }

  // Synonyms & Antonyms — separate lines, template colors
  if ((data.syn && data.syn.length) || (data.ant && data.ant.length)) {
    children.push(new Paragraph({
      spacing: { before: 160 },
      children: [
        new TextRun({ text: '【同反義詞】', size: 28, font: 'Arial Unicode MS', bold: true, color: GRAY }),
      ]
    }));
    if (data.syn && data.syn.length) {
      const words = data.syn.map(s => s.w + (s.m ? ' ' + s.m : '')).join(', ');
      children.push(new Paragraph({
        spacing: { before: 160 },
        indent: { left: 600 },
        children: [
          new TextRun({ text: '(同)', size: 28, font: 'Arial Unicode MS', bold: true, color: 'FF0000' }),
          new TextRun({ text: ' ' + words, size: 28, font: 'Arial Unicode MS', color: 'FF0000' })
        ]
      }));
    }
    if (data.ant && data.ant.length) {
      const words = data.ant.map(a => a.w + (a.m ? ' ' + a.m : '')).join(', ');
      children.push(new Paragraph({
        spacing: { before: 160 },
        indent: { left: 600 },
        children: [
          new TextRun({ text: '(反)', size: 28, font: 'Arial Unicode MS', bold: true, color: '3A7C22' }),
          new TextRun({ text: ' ' + words, size: 28, font: 'Arial Unicode MS', color: '3A7C22' })
        ]
      }));
    }
  }

  // Source info — template footer
  children.push(new Paragraph({
    spacing: { before: 200 },
    children: [new TextRun({ text: '資料來源：' + (data.src || '海詞 dict.cn'), size: 18, font: 'Arial Unicode MS', color: '999999', italics: true })]
  }));

  const doc = new Document({ sections: [{ properties: {}, children }] });
  const blob = await Packer.toBlob(doc);
  saveAs(blob, filename);
}
</script>

</body>
</html>
