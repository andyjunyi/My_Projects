<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文法考點詳解 ── 102–114年歷屆例句</title>
<style>
  :root {
    --purple: #7c3aed;
    --purple2: #a855f7;
    --teal: #22b4a0;
    --amber: #f59e0b;
    --red: #ef4444;
    --dark: #1f2937;
    --gray: #6b7280;
    --light: #f5f3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: #f0f4ff; color: var(--dark); display: flex; flex-direction: column; min-height: 100vh; }

  /* ── Top Bar ── */
  .topbar {
    background: linear-gradient(135deg, #1e1b4b, #312e81, #1d4ed8);
    color: #fff; padding: .8rem 1.5rem; display: flex; align-items: center; gap: 1rem;
    position: sticky; top: 0; z-index: 100;
  }
  .back-btn {
    background: rgba(255,255,255,.2); border: none; color: #fff; border-radius: 8px;
    padding: .4rem .9rem; cursor: pointer; font-size: .88rem; text-decoration: none;
    display: inline-flex; align-items: center; gap: .3rem; transition: background .2s;
  }
  .back-btn:hover { background: rgba(255,255,255,.35); }
  .topbar-title { font-size: 1rem; font-weight: 700; flex: 1; }
  .topbar-sub { font-size: .8rem; opacity: .75; }

  /* ── Layout ── */
  .layout { display: flex; flex: 1; max-width: 1300px; margin: 0 auto; width: 100%; padding: 1.2rem; gap: 1.2rem; }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px; flex-shrink: 0; position: sticky; top: 60px; height: calc(100vh - 70px); overflow-y: auto;
    background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: .8rem .6rem;
  }
  .sidebar-title { font-size: .72rem; font-weight: 700; letter-spacing: 1px; color: var(--gray); padding: .3rem .6rem .5rem; }
  .nav-btn {
    width: 100%; text-align: left; background: none; border: none; border-radius: 8px;
    padding: .55rem .7rem; margin-bottom: .2rem; cursor: pointer; font-size: .82rem;
    display: flex; align-items: center; gap: .5rem; transition: all .15s; color: var(--dark);
  }
  .nav-btn:hover { background: var(--light); color: var(--purple); }
  .nav-btn.active { background: var(--purple); color: #fff; font-weight: 700; }
  .nav-num {
    width: 22px; height: 22px; border-radius: 50%; background: #e5e7eb; color: var(--dark);
    font-size: .72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .nav-btn.active .nav-num { background: rgba(255,255,255,.3); color: #fff; }
  .nav-btn.tier2 .nav-num { background: #d1fae5; color: #065f46; }
  .nav-btn.tier3 .nav-num { background: #fef3c7; color: #92400e; }
  .nav-btn.tier2.active .nav-num,
  .nav-btn.tier3.active .nav-num { background: rgba(255,255,255,.3); color: #fff; }
  .nav-btn.tier2.active { background: var(--teal); }
  .nav-btn.tier3.active { background: var(--amber); }

  /* ── Main ── */
  .main { flex: 1; min-width: 0; }

  /* ── Grammar Header Card ── */
  .gram-header {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border-radius: 14px; padding: 1.5rem 1.8rem; color: #fff; margin-bottom: 1.2rem;
  }
  .gram-header.tier2 { background: linear-gradient(135deg, #0d9488, #22b4a0); }
  .gram-header.tier3 { background: linear-gradient(135deg, #d97706, #f59e0b); }
  .gram-rank-badge { display: inline-flex; align-items: center; gap: .4rem; background: rgba(255,255,255,.25); border-radius: 99px; padding: .2rem .8rem; font-size: .8rem; font-weight: 700; margin-bottom: .7rem; }
  .gram-header h1 { font-size: 1.5rem; margin-bottom: .15rem; }
  .gram-header .en { font-size: .95rem; opacity: .85; margin-bottom: 1rem; }
  .gram-meta { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  .gram-meta-box { background: rgba(255,255,255,.15); border-radius: 10px; padding: .8rem 1rem; }
  .gram-meta-box .label { font-size: .72rem; opacity: .8; margin-bottom: .25rem; letter-spacing: .5px; }
  .gram-meta-box .val { font-size: .88rem; font-weight: 600; font-family: 'Courier New', monospace; }
  .gram-meta-box .tip { font-size: .82rem; line-height: 1.5; }

  /* ── Stat Row ── */
  .stat-row { display: flex; align-items: center; gap: 1rem; background: #fff; border-radius: 10px; padding: .8rem 1.2rem; margin-bottom: 1.2rem; box-shadow: 0 1px 6px rgba(0,0,0,.07); flex-wrap: wrap; }
  .stat-item { display: flex; flex-direction: column; gap: .1rem; }
  .stat-item .sv { font-size: 1.4rem; font-weight: 700; color: var(--purple); }
  .stat-item .sl { font-size: .72rem; color: var(--gray); }
  .stat-sep { width: 1px; height: 30px; background: #e5e7eb; }
  .year-pill-row { display: flex; flex-wrap: wrap; gap: .35rem; }
  .year-pill { font-size: .72rem; padding: .2rem .55rem; border-radius: 99px; font-weight: 700; }
  .year-pill.yes { background: #ede9fe; color: #6d28d9; }
  .year-pill.no  { background: #f3f4f6; color: #9ca3af; }

  /* ── Section Label ── */
  .section-lbl { font-size: .8rem; font-weight: 700; letter-spacing: 1px; color: var(--gray); text-transform: uppercase; margin-bottom: .7rem; display: flex; align-items: center; gap: .4rem; }
  .section-lbl::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }

  /* ── Sentence Card ── */
  .sentence-cards { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
  .scard {
    background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07);
    overflow: hidden; border-left: 4px solid var(--purple);
  }
  .scard.tier2 { border-left-color: var(--teal); }
  .scard.tier3 { border-left-color: var(--amber); }
  .scard-top { padding: 1rem 1.2rem .7rem; }
  .scard-year { display: inline-block; background: #ede9fe; color: #6d28d9; font-size: .72rem; font-weight: 700; border-radius: 99px; padding: .15rem .65rem; margin-bottom: .6rem; }
  .scard.tier2 .scard-year { background: #d1fae5; color: #065f46; }
  .scard.tier3 .scard-year { background: #fef3c7; color: #92400e; }
  .sentence-en { font-size: 1rem; line-height: 1.7; margin-bottom: .5rem; }
  .sentence-en em { font-style: normal; color: #7c3aed; font-weight: 700; background: #ede9fe; border-radius: 3px; padding: 0 .15rem; }
  .scard.tier2 .sentence-en em { color: #0d9488; background: #d1fae5; }
  .scard.tier3 .sentence-en em { color: #b45309; background: #fef3c7; }
  .sentence-zh { font-size: .88rem; color: #374151; background: #f9fafb; border-radius: 6px; padding: .5rem .7rem; border-left: 3px solid #e5e7eb; }

  /* ── Vocab Table ── */
  .vocab-section { border-top: 1px solid #f3f4f6; padding: .7rem 1.2rem .9rem; background: #fafafa; }
  .vocab-label { font-size: .72rem; font-weight: 700; color: var(--gray); letter-spacing: .5px; margin-bottom: .5rem; }
  .vocab-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .vocab-table th { text-align: left; font-size: .7rem; letter-spacing: .5px; color: var(--gray); font-weight: 600; padding: .25rem .5rem; border-bottom: 1px solid #e5e7eb; }
  .vocab-table td { padding: .35rem .5rem; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
  .vocab-table tr:last-child td { border-bottom: none; }
  .td-word { font-weight: 700; color: var(--dark); }
  .td-kk { font-family: 'Courier New', monospace; color: #374151; font-size: .78rem; }
  .td-pos { background: #ede9fe; color: #6d28d9; border-radius: 4px; padding: .1rem .4rem; font-size: .7rem; font-weight: 700; white-space: nowrap; }
  .scard.tier2 .td-pos { background: #d1fae5; color: #065f46; }
  .scard.tier3 .td-pos { background: #fef3c7; color: #92400e; }
  .td-zh { color: #374151; }

  /* ── Rule Summary Box ── */
  .rule-box { background: #fff; border-radius: 12px; padding: 1.2rem 1.4rem; box-shadow: 0 2px 8px rgba(0,0,0,.07); margin-bottom: 1.5rem; border-top: 3px solid var(--purple); }
  .rule-box.tier2 { border-top-color: var(--teal); }
  .rule-box.tier3 { border-top-color: var(--amber); }
  .rule-box h3 { font-size: .95rem; margin-bottom: .7rem; }
  .rule-list { list-style: none; }
  .rule-list li { padding: .3rem 0; font-size: .85rem; border-bottom: 1px solid #f3f4f6; display: flex; gap: .5rem; }
  .rule-list li:last-child { border-bottom: none; }
  .rule-list li::before { content: '▸'; color: var(--purple); flex-shrink: 0; }
  .rule-box.tier2 .rule-list li::before { color: var(--teal); }
  .rule-box.tier3 .rule-list li::before { color: var(--amber); }

  footer { text-align: center; color: var(--gray); font-size: .75rem; padding: 1.5rem; }

  @media (max-width: 768px) {
    .layout { flex-direction: column; padding: .8rem; }
    .sidebar { width: 100%; position: static; height: auto; max-height: 200px; }
    .gram-meta { grid-template-columns: 1fr; }
  }
</style>
</head>

function tierClass(t){ return t===2?'tier2':t===3?'tier3':''; }

function yearRow(years, count){
  const labels=['102','103','104','105','106','107','108','109','110','111','112','113','114'];
  return labels.map((y,i)=>`<span class="year-pill ${years[i]?'yes':'no'}">${y}</span>`).join('');
}

function vocabRows(vocab){
  return vocab.map(v=>`
    <tr>
      <td class="td-word">${v.w}</td>
      <td class="td-kk">${v.kk}</td>
      <td><span class="td-pos">${v.pos}</span></td>
      <td class="td-zh">${v.zh}</td>
    </tr>`).join('');
}

function render(id){
  const d = G[id];
  const tc = tierClass(d.tier);
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="gram-header ${tc}">
      <div class="gram-rank-badge">第 ${id} 名 ／ 15大文法考點</div>
      <h1>${d.title}</h1>
      <div class="en">${d.en}</div>
      <div class="gram-meta">
        <div class="gram-meta-box"><div class="label">句型結構</div><div class="val">${d.structure.replace(/\n/g,'<br>')}</div></div>
        <div class="gram-meta-box"><div class="label">學習要點</div><div class="tip">${d.tip}</div></div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-item"><div class="sv" style="color:${d.tier===1?'#7c3aed':d.tier===2?'#22b4a0':'#f59e0b'}">${d.count}/13</div><div class="sl">出現年份</div></div>
      <div class="stat-sep"></div>
      <div class="year-pill-row">${yearRow(d.years, d.count)}</div>
    </div>

    <div class="rule-box ${tc}">
      <h3>核心規則整理</h3>
      <ul class="rule-list">${d.rules.map(r=>`<li>${r}</li>`).join('')}</ul>
    </div>

    <div class="section-lbl">歷屆考題例句（${d.sentences.length} 題）</div>
    <div class="sentence-cards">
      ${d.sentences.map(s=>`
        <div class="scard ${tc}">
          <div class="scard-top">
            <div class="scard-year">${s.year} 年</div>
            <div class="sentence-en">${s.en}</div>
            <div class="sentence-zh">📖 ${s.zh}</div>
          </div>
          <div class="vocab-section">
            <div class="vocab-label">必備單字</div>
            <table class="vocab-table">
              <thead><tr><th>單字</th><th>KK音標</th><th>詞類</th><th>中文</th></tr></thead>
              <tbody>${vocabRows(s.vocab)}</tbody>
            </table>
          </div>
        </div>`).join('')}
    </div>
  `;
}

function show(id, btn){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(id);
  window.scrollTo({top:0, behavior:'smooth'});
  location.hash = id;
}

// Init
const hash = parseInt(location.hash.replace('#','')) || 1;
render(hash);
document.querySelectorAll('.nav-btn')[hash-1]?.classList.add('active');
</script>
