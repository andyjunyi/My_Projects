<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My_Projects · 專案總覽</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #eee;
    --text2: #aaa;
    --text3: #666;
    --border: #2a2a4a;
    --hover: #2a2a4a;
    --code: #60a5fa;
    --web: #4ade80;
    --data: #fbbf24;
    --doc: #fb923c;
    --image: #c084fc;
    --video: #e879f9;
    --config: #94a3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, #0f3460, #1a1a2e);
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .header .sub { color: var(--text2); font-size: 13px; }
  .header .stats {
    display: flex; gap: 16px; justify-content: center;
    margin-top: 10px; font-size: 12px; color: var(--text2);
  }
  .header .stats span { white-space: nowrap; }
  .header .stats strong { color: var(--text); }

  .content { padding: 16px; max-width: 800px; margin: 0 auto; }

  /* Search bar */
  .search-row {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .search-row input {
    flex: 1; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: 14px; outline: none;
    font-family: inherit;
    transition: border .2s;
  }
  .search-row input:focus { border-color: var(--accent); }
  .search-row select {
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: 13px; outline: none;
    font-family: inherit; cursor: pointer;
    min-width: 80px;
  }

  /* Project cards */
  .projects { display: flex; flex-direction: column; gap: 8px; }

  .project {
    background: var(--card); border-radius: 12px;
    border: 1px solid var(--border); overflow: hidden;
    transition: border-color .2s;
  }
  .project:hover { border-color: var(--accent2); }
  .project.open { border-color: var(--accent); }

  .project-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; cursor: pointer; user-select: none;
    transition: background .15s;
  }
  .project-header:hover { background: rgba(255,255,255,.02); }

  .project-icon {
    font-size: 20px; width: 28px; text-align: center;
    flex-shrink: 0;
  }
  .project-name {
    flex: 1; font-size: 15px; font-weight: 600;
  }
  .project-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--text3); white-space: nowrap;
  }
  .project-meta .tag {
    background: rgba(255,255,255,.06); padding: 2px 8px;
    border-radius: 4px;
  }
  .project-meta .tag.web { background: rgba(74,222,128,.12); color: var(--web); }
  .project-arrow {
    color: var(--text3); font-size: 12px;
    transition: transform .2s; flex-shrink: 0;
  }
  .project.open .project-arrow { transform: rotate(90deg); }

  /* File tree */
  .file-tree {
    display: none; border-top: 1px solid var(--border);
    padding: 8px 0; background: rgba(0,0,0,.15);
  }
  .project.open .file-tree { display: block; }

  .tree-item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 16px 4px 32px; font-size: 13px;
    transition: background .1s; cursor: default;
  }
  .tree-item:hover { background: rgba(255,255,255,.03); }
  .tree-item .fi { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
  .tree-item .fn { flex: 1; color: var(--text); }
  .tree-item .fm { color: var(--text3); font-size: 11px; white-space: nowrap; }
  .tree-item .fs { color: var(--text3); font-size: 11px; white-space: nowrap; width: 60px; text-align: right; }

  /* Subdirectory toggle */
  .tree-dir {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 16px 4px 32px; font-size: 13px;
    cursor: pointer; color: var(--text2); font-weight: 500;
    transition: background .1s;
  }
  .tree-dir:hover { background: rgba(255,255,255,.03); }
  .tree-dir .arrow { font-size: 10px; transition: transform .2s; width: 12px; text-align: center; }
  .tree-dir.open .arrow { transform: rotate(90deg); }
  .tree-dir .di { font-size: 14px; width: 20px; text-align: center; }

  .tree-children { display: none; }
  .tree-dir.open + .tree-children { display: block; }

  /* Type color dots */
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-code   { background: var(--code); }
  .dot-web    { background: var(--web); }
  .dot-data   { background: var(--data); }
  .dot-doc    { background: var(--doc); }
  .dot-image  { background: var(--image); }
  .dot-video  { background: var(--video); }
  .dot-config { background: var(--config); }
  .dot-default{ background: var(--text3); }

  /* Type badges in header */
  .type-badges {
    display: flex; gap: 3px; flex-wrap: wrap;
  }
  .type-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 3px;
    background: rgba(255,255,255,.06); color: var(--text3);
  }

  /* Empty state */
  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--text3); font-size: 15px;
  }

  /* Footer */
  .footer {
    text-align: center; padding: 20px;
    font-size: 11px; color: var(--text3);
  }
</style>
</head>
<body>

<div class="header">
  <h1>📁 My_Projects</h1>
  <div class="sub">自動掃描 · 即時檔案列表</div>
  <div class="stats" id="statsBar">
    <span>📂 <strong id="catCount">0</strong> 專案</span>
    <span>📦 <strong id="fileCount">0</strong> 檔案</span>
    <span id="dataInfo">⏳ 載入中...</span>
  </div>
</div>

<div class="content">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="🔍 搜尋專案或檔案名稱..." oninput="render()">
    <select id="filterType" onchange="render()">
      <option value="">全部</option>
      <option value="web">🌐 網站</option>
      <option value="code">📄 程式碼</option>
      <option value="doc">📝 文件</option>
      <option value="data">📊 資料</option>
      <option value="image">🖼️ 圖片</option>
      <option value="video">🎬 影片</option>
    </select>
  </div>
  <div class="projects" id="grid"></div>
</div>

<div class="footer">自動產生 — 重新整理頁面即可更新</div>

<script>
let DATA = null;

async function init() {
  try {
    const resp = await fetch('projects_data.json?' + Date.now());
    DATA = await resp.json();
    document.getElementById('dataInfo').textContent =
      '🔄 ' + DATA.generated;
    render();
  } catch(e) {
    document.getElementById('dataInfo').textContent = '⚠️ 載入失敗';
  }
}

function render() {
  if (!DATA) return;
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const typeFilter = document.getElementById('filterType').value;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  let showProjects = DATA.projects;

  // Type filter: only show projects with matching file types
  if (typeFilter) {
    showProjects = showProjects.filter(p => p.tc && p.tc[typeFilter]);
  }

  // Search
  if (q) {
    showProjects = showProjects.filter(p => {
      if (p.n.toLowerCase().includes(q)) return true;
      if (p.d && p.d.toLowerCase().includes(q)) return true;
      return fileSearch(p.c, q);
    });
  }

  // Stats
  let totalFiles = 0;
  showProjects.forEach(p => totalFiles += p.fc);
  document.getElementById('catCount').textContent = showProjects.length;
  document.getElementById('fileCount').textContent = totalFiles;

  if (!showProjects.length) {
    grid.innerHTML = '<div class="empty">沒有符合的項目 🙁</div>';
    return;
  }

  for (const proj of showProjects) {
    const card = document.createElement('div');
    card.className = 'project';

    const isWeb = proj.wh;

    // Type badges
    let badgeHtml = '';
    if (proj.tc) {
      const order = ['web','code','data','doc','image'];
      for (const t of order) {
        if (proj.tc[t]) {
          badgeHtml += `<span class="type-badge">${t}</span>`;
        }
      }
    }

    card.innerHTML = `
      <div class="project-header" onclick="toggleProject(this)">
        <span class="project-icon">${isWeb ? '🌐' : '📁'}</span>
        <span class="project-name">${proj.n}</span>
        <div class="project-meta">
          <span class="tag ${isWeb ? 'web' : ''}">${proj.fc} 檔</span>
          ${badgeHtml ? `<span class="type-badges">${badgeHtml}</span>` : ''}
        </div>
        <span class="project-arrow">▶</span>
      </div>
      <div class="file-tree">
        ${renderTree(proj.c, q)}
      </div>
    `;

    grid.appendChild(card);
  }
}

function toggleProject(el) {
  const card = el.closest('.project');
  card.classList.toggle('open');
}

function toggleDir(el) {
  el.classList.toggle('open');
}

function fileSearch(content, q) {
  if (!content) return false;
  for (const f of (content.files || [])) {
    if (f.n.toLowerCase().includes(q)) return true;
  }
  for (const d of (content.dirs || [])) {
    if (d.n.toLowerCase().includes(q)) return true;
    if (fileSearch(d.c, q)) return true;
  }
  return false;
}

function highlightText(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark style="background:#e9456044;color:#eee">' +
         text.slice(idx, idx + q.length) + '</mark>' +
         text.slice(idx + q.length);
}

function renderTree(content, q) {
  if (!content || content.error) {
    return '<div class="tree-item" style="color:var(--text3);padding-left:32px">⚠️ 無法讀取</div>';
  }

  let html = '';

  // Directories
  for (const dir of content.dirs) {
    const matched = q && dir.n.toLowerCase().includes(q);
    html += `
      <div class="tree-dir" onclick="toggleDir(this)">
        <span class="arrow">▶</span>
        <span class="di">📁</span>
        <span class="fn">${q ? highlightText(dir.n, q) : dir.n}</span>
        <span class="fm">${dir.fc} 項</span>
        <span class="fs">${dir.m}</span>
      </div>
      <div class="tree-children">
        ${dir.c ? renderTree(dir.c, q) : ''}
      </div>
    `;
  }

  // Files
  for (const f of content.files) {
    const dotClass = f.t || 'default';
    const fnDisplay = q ? highlightText(f.n, q) : f.n;
    html += `
      <div class="tree-item">
        <span class="dot dot-${dotClass}"></span>
        <span class="fi">${f.i}</span>
        <span class="fn">${fnDisplay}</span>
        <span class="fm">${f.m}</span>
        <span class="fs">${f.s}</span>
      </div>
    `;
  }

  return html || '<div class="tree-item" style="color:var(--text3)">（空資料夾）</div>';
}

init();
</script>
</body>
</html>
